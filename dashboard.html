<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LATTE LAB · Dashboard</title>
  <link rel="icon" href="image/logo.JPG" />
  <style>
    :root {
      --bg: #f7f8f4; --surface: #ffffff; --surface-2: #edf5f0; --ink: #17211d;
      --muted: #66746c; --line: #dce5dd; --brand: #0f5c4d; --accent: #d86f45;
      --danger: #b33939; --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100%; margin: 0;
      background: linear-gradient(180deg, rgba(15,92,77,0.06), transparent 360px), var(--bg);
      color: var(--ink); padding: 18px 18px 48px;
    }
    .app-shell { width: min(1280px, 100%); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0 18px; flex-wrap: wrap; }
    .brand-lockup { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 50px; height: 50px; border-radius: var(--radius); object-fit: cover; border: 1px solid rgba(23,33,29,0.12); background: var(--surface); }
    .brand-lockup h1 { margin: 0; font-size: 1.5rem; line-height: 1; }
    .back-btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--brand); text-decoration: none;
      font-size: 0.82rem; font-weight: 800; box-shadow: 0 4px 14px rgba(23,33,29,0.06);
    }
    .back-btn:hover { background: var(--surface-2); }
    .filter-bar {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface);
    }
    .filter-scroll { display: flex; align-items: center; gap: 8px; }
    .filter-dropdown { position: relative; }
    .product-toggle-btn {
      height: 34px; padding: 0 14px; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface); color: var(--ink);
      font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    .product-toggle-btn:hover { background: var(--surface-2); }
    .product-toggle-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .clear-filter-btn { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; padding: 0 10px !important; font-size: 0.72rem !important; height: 32px; }
    .clear-filter-btn:hover { opacity: 0.85 !important; background: var(--danger) !important; }
    .product-menu {
      position: absolute; top: 100%; left: 0; z-index: 100; margin-top: 4px;
      max-height: 200px; min-width: 180px; box-shadow: 0 8px 24px rgba(23,33,29,0.15);
      display: none;
    }
    .product-menu.show { display: flex; }
    .period-checkboxes {
      max-height: 180px; overflow-y: auto; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface); padding: 6px 8px;
      min-width: 160px; display: none; flex-direction: column; gap: 2px;
    }
    .period-checkboxes.show { display: flex; }
    .period-checkboxes label {
      display: flex; align-items: center; gap: 6px; font-size: 0.75rem;
      font-weight: 500; color: var(--ink); padding: 2px 4px; border-radius: 4px; cursor: pointer;
    }
    .period-checkboxes label:hover { background: var(--surface-2); }
    .period-checkboxes input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; }
    .period-checkboxes .select-all { font-weight: 800; color: var(--brand); }
    .period-checkboxes .menu-sep { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
    .day-calendar {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 8px; width: 240px;
      box-shadow: 0 6px 18px rgba(23,33,29,0.1);
    }
    .cal-drop { position: absolute; top: 100%; left: 0; z-index: 100; margin-top: 4px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 0 6px; }
    .cal-month { font-size: 0.8rem; font-weight: 800; color: var(--ink); }
    .cal-arrow {
      width: 24px; height: 24px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--ink); font-size: 0.7rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-arrow:hover { background: var(--surface-2); }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 2px 0 4px; }
    .cal-weekdays span { font-size: 0.6rem; font-weight: 800; color: var(--muted); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600; border-radius: 4px; cursor: pointer;
      color: var(--muted); border: 1px solid transparent; min-height: 28px;
    }
    .cal-day:hover { background: var(--surface-2); border-color: var(--line); }
    .cal-day.has-data { color: var(--ink); font-weight: 700; }
    .cal-day.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
    .cal-day.dimmed { opacity: 0.3; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-day.empty { cursor: default; }
    .cal-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 1px 0; font-size: 0.65rem; color: var(--muted); }
    .cal-clear { border: 0; background: none; color: var(--danger); font-size: 0.65rem; font-weight: 700; cursor: pointer; }
    .cal-clear:hover { text-decoration: underline; }
    .status-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .status-card {
      padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: 0 4px 14px rgba(23,33,29,0.04); text-align: center;
    }
    .status-card .label { color: var(--muted); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .status-card .value { font-size: 1.6rem; font-weight: 900; color: var(--brand); line-height: 1.2; margin-top: 2px; }
    .status-card.today .value { color: #1a4b8c; }
    .status-card.week .value { color: #0f5c4d; }
    .status-card.month .value { color: #d86f45; }
    .status-card.total .value { color: var(--ink); }
    .status-card.nw .value { color: #e65100; }
    .status-card.ok .value { color: #2e7d32; }
    .charts-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 20px; }
    .chart-card {
      padding: 18px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: 0 4px 20px rgba(23,33,29,0.05);
    }
    .chart-card.full { grid-column: 1 / -1; }
    .chart-card h3 { margin: 0 0 14px; font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
    .chart-card .chart-wrap { position: relative; width: 100%; height: 300px; }
    .chart-card .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 8px; }
    .loading-bar {
      width: 100%; height: 3px; background: var(--surface-2);
      border-radius: 2px; overflow: hidden; margin-bottom: 0;
    }
    .loading-bar::after {
      content: ''; display: block; width: 40%; height: 100%;
      background: var(--brand); border-radius: 2px;
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .no-data-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.85rem; font-weight: 600; pointer-events: none;
    }
    .auto-refresh-hint { font-size: 0.65rem; color: var(--muted); text-align: right; padding: 4px 0 0; }
    .race-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .race-header h3 { margin: 0; }
    .race-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .race-controls label { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .race-controls input[type="date"] {
      height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--ink); font-size: 0.75rem;
    }
    .race-btn {
      height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--ink); font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    .race-btn:hover { background: var(--surface-2); }
    .race-play-btn { background: #107C41 !important; color: #fff !important; border-color: #107C41 !important; }
    .race-play-btn:hover:not(:disabled) { background: #0d6937 !important; }
    .race-btn:disabled { opacity: 0.4; cursor: default; }
    .race-date { font-size: 0.9rem; font-weight: 800; color: var(--brand); text-align: center; padding: 6px 0 0; }
    .race-card .chart-wrap { height: 350px; }
    .race-canvas { width: 100% !important; height: 100% !important; }
    .race-card .product-toggle-btn { background: #107C41; color: #fff; border-color: #107C41; }
    .race-card .product-toggle-btn:hover { background: #0d6937; }
    .race-card .product-toggle-btn.active { background: var(--brand) !important; color: #fff; border-color: var(--brand) !important; }
    @media (max-width: 720px) {
      body { padding: 12px 12px 32px; }
      .charts-grid { grid-template-columns: 1fr; }
      .status-cards { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .status-card { padding: 10px 12px; }
      .status-card .value { font-size: 1.2rem; }
      .brand-lockup h1 { font-size: 1.2rem; }
      .brand-logo { width: 40px; height: 40px; }
      .filter-scroll { flex-wrap: wrap; }
      .chart-card .chart-wrap { height: 250px; }
      .race-card .chart-wrap { height: 280px; }
      .day-calendar { width: 220px; }
      .race-header { flex-direction: column; align-items: flex-start; }
      .race-controls { gap: 6px; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-lockup">
      <img class="brand-logo" src="image/logo.JPG" alt="LATTE LAB" />
      <h1>LATTE LAB</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="back-btn" id="refreshDashBtn" style="cursor:pointer;">Refresh</button>
      <a class="back-btn" href="index.html">Back to Orders</a>
    </div>
  </header>
  <div class="filter-bar">
    <div class="filter-scroll">
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="dayToggle">Day ▾</button>
      <div id="dayCalendar" class="day-calendar cal-drop" style="display:none;">
        <div class="cal-header">
          <button type="button" class="cal-arrow" id="calPrev">◀</button>
          <span class="cal-month" id="calMonthLabel"></span>
          <button type="button" class="cal-arrow" id="calNext">▶</button>
        </div>
        <div class="cal-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-footer"><span id="calCount">0 selected</span> · <button type="button" class="cal-clear" id="calClear">Clear</button></div>
      </div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="weekToggle">Week ▾</button>
      <div id="weekCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="monthToggle">Month ▾</button>
      <div id="monthCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="productToggle">Product ▾</button>
      <div id="productCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <button class="product-toggle-btn clear-filter-btn" id="clearFilterBtn">Clear</button>
    </div>
  </div>
  <div class="status-cards" id="statusCards"></div>
  <div class="loading-bar" id="loadingBar" style="display:none;"></div>
  <div class="charts-grid">
    <div class="chart-card full"><h3>Orders</h3><div class="chart-wrap"><canvas id="ordersChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products</h3><div class="chart-wrap"><canvas id="topProductsChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products · Daily Trend</h3><div class="chart-wrap"><canvas id="productTrendChart"></canvas></div></div>
    <div class="chart-card full race-card">
      <div class="race-header">
        <h3>Product Race</h3>
        <div class="race-controls">
          <div class="filter-dropdown">
            <button class="product-toggle-btn" id="raceProdToggle">Products ▾</button>
            <div id="raceProdCheckboxes" class="period-checkboxes product-menu"></div>
          </div>
          <label>Start <input type="date" id="raceStartDate"></label>
          <button id="racePlay" class="race-btn race-play-btn">▶ Play</button>
          <button id="racePause" class="race-btn" disabled><span style="color:#FFBA01;">❚❚</span> Pause</button>
          <button id="raceStop" class="race-btn" disabled><span style="color:#b33939;">■</span> Stop</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="raceChart" class="race-canvas"></canvas></div>
      <div class="race-date" id="raceDateLabel"></div>
    </div>
  </div>
  <div class="auto-refresh-hint" id="refreshHint"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
</script>
<script src="config.js">
</script>
<script>
  (function() {
    "use strict";

    // ========================================================================
    // 0. CONFIG & STATE
    // ========================================================================
    const CFG = window.LATTE_LAB_CONFIG || {};
    const RACE_COLORS = [
      '#F34F1C', '#7FBC00', '#FFBA01', '#01A6F0', '#747474', '#107C41',
      '#FF6700', '#FF9900', '#D75F28', '#E91B21', '#ED1C24',
      '#B12B28', '#EA4335', '#9F2B32', '#FF4D00', '#D9004C',
      '#0F9D58', '#3DDC84', '#1DB954', '#76B900', '#7FBA00',
      '#53AF40', '#28C08A', '#3B7A57', '#005A3C', '#00BF7E',
      '#0052D9', '#4285F4', '#3b5998', '#007AFF', '#00A4EF',
      '#0071C5', '#1428A0', '#1B4E9B', '#0530AD', '#002FA7',
      '#12355B', '#0057B8', '#003153', '#005C8A', '#0A84F4',
      '#F4B400', '#FFB900', '#E3AB36', '#D6A94A', '#957327',
      '#FF00FF', '#9B5CFF', '#7B0099', '#FF69B4', '#B31414',
      '#900020', '#FF7A59', '#81D8D0', '#38D9FF', '#00F0FF',
      '#8C8C8C', '#333333', '#070B1A', '#A67C52', '#778899',
      '#DBDEB8'
    ];

    // --- DOM Cache (Phase 5) ---
    const $ = (id) => document.getElementById(id);
    const dom = {
      statusCards: $('statusCards'),
      loadingBar: $('loadingBar'),
      refreshHint: $('refreshHint'),
      ordersChart: $('ordersChart'),
      topProductsChart: $('topProductsChart'),
      productTrendChart: $('productTrendChart'),
      raceChart: $('raceChart'),
      raceDateLabel: $('raceDateLabel'),
      dayToggle: $('dayToggle'),
      dayCalendar: $('dayCalendar'),
      calGrid: $('calGrid'),
      calMonthLabel: $('calMonthLabel'),
      calPrev: $('calPrev'),
      calNext: $('calNext'),
      calClear: $('calClear'),
      calCount: $('calCount'),
      weekToggle: $('weekToggle'),
      weekCheckboxes: $('weekCheckboxes'),
      monthToggle: $('monthToggle'),
      monthCheckboxes: $('monthCheckboxes'),
      productToggle: $('productToggle'),
      productCheckboxes: $('productCheckboxes'),
      clearFilterBtn: $('clearFilterBtn'),
      raceProdToggle: $('raceProdToggle'),
      raceProdCheckboxes: $('raceProdCheckboxes'),
      raceStartDate: $('raceStartDate'),
      racePlay: $('racePlay'),
      racePause: $('racePause'),
      raceStop: $('raceStop'),
      refreshDashBtn: $('refreshDashBtn'),
    };

    // --- State & Cache (Phase 1) ---
    let supabase = null;
    let charts = { orders: null, top5: null, trend: null };

    // Raw data
    let allItems = [];

    // Filter state
    const filters = {
      days: new Set(),
      weeks: new Set(),
      months: new Set(),
      products: new Set(),
    };

    // Derived cache
    let cacheVersion = 0;
    let cachedFilteredItems = null;
    let cachedStats = null;
    let cachedChartData = { orders: null, top5: null, trend: null };
    let cachedRaceData = null;
    let raceDataVersion = 0;

    // Race state
    let raceState = {
      bars: [],
      playing: false,
      index: 0,
      timer: null,
      animId: null,
      ctx: null,
      canvas: null,
      resizeObs: null,
      resizePending: false,
      data: [],
    };

    // Calendar state
    let calMonth, calYear;

    // ========================================================================
    // 1. UTILITY FUNCTIONS
    // ========================================================================
    function pad(n) { return String(n).padStart(2, '0'); }

    function dparse(s) { if (!s) return null; var d = new Date(s); return isNaN(d.getTime()) ? null : d; }

    function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

    function weekKey(d) {
      var dn = (d.getDay() + 6) % 7;
      var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dn);
      var t = new Date(d.valueOf());
      t.setDate(t.getDate() - dn + 3);
      var ft = new Date(t.getFullYear(), 0, 4);
      var wk = Math.round((t.getTime() - ft.getTime()) / 604800000) + 1;
      return mon.getFullYear() + '-W' + pad(wk);
    }

    function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

    function matchPeriod(r) {
      var d = dparse(r.created_at);
      if (!d) return false;
      if (filters.days.size > 0 && !filters.days.has(dayKey(d))) return false;
      if (filters.weeks.size > 0 && !filters.weeks.has(weekKey(d))) return false;
      if (filters.months.size > 0 && !filters.months.has(monthKey(d))) return false;
      return true;
    }

    function getProductColor(name) {
      var h = 0;
      for (var i = 0; i < name.length; i++) h = ((h << 5) - h) + name.charCodeAt(i);
      return RACE_COLORS[Math.abs(h) % RACE_COLORS.length];
    }

    // ========================================================================
    // 2. DATA LAYER (Phase 1)
    // ========================================================================
    function getFilteredItems() {
      if (cachedFilteredItems !== null) return cachedFilteredItems;

      const result = allItems.filter(function(r) {
        if (filters.products.size > 0 && !filters.products.has(r.name)) return false;
        return matchPeriod(r);
      });

      cachedFilteredItems = result;
      return result;
    }

    function computeStats() {
      if (cachedStats !== null) return cachedStats;

      var now = new Date();
      var tk = dayKey(now),
        wkK = weekKey(now),
        mk = monthKey(now);
      var td = 0,
        wk = 0,
        mo = 0;

      for (var i = 0; i < allItems.length; i++) {
        var d = dparse(allItems[i].created_at);
        if (!d) continue;
        var q = Number(allItems[i].quantity) || 0;
        if (dayKey(d) === tk) td += q;
        if (weekKey(d) === wkK) wk += q;
        if (monthKey(d) === mk) mo += q;
      }

      var items = getFilteredItems();
      var total = 0,
        nw = 0,
        ok = 0;
      for (var i = 0; i < items.length; i++) {
        var q = Number(items[i].quantity) || 0;
        total += q;
        if (items[i].status === 'new') nw += q;
        else if (items[i].status === 'completed') ok += q;
      }

      cachedStats = { today: td, week: wk, month: mo, total: total, new: nw, completed: ok };
      return cachedStats;
    }

    function invalidateCache() {
      cacheVersion++;
      cachedFilteredItems = null;
      cachedStats = null;
      cachedChartData = { orders: null, top5: null, trend: null };
      raceDataVersion++;
      cachedRaceData = null;
    }

    // ========================================================================
    // 3. CHART LAYER (Phase 2)
    // ========================================================================
    function barLabelPlugin() {
      return {
        id: 'barLabel',
        afterDraw: function(chart) {
          var ctx = chart.ctx,
            ds = chart.data.datasets[0];
          if (!ds) return;
          var meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data) return;
          ctx.fillStyle = '#17211d';
          ctx.font = 'bold 11px Inter,sans-serif';
          ctx.textAlign = 'center';
          for (var i = 0; i < meta.data.length; i++) {
            var b = meta.data[i],
              v = ds.data[i];
            if (!v) continue;
            ctx.fillText(v, b.x, b.y - 8);
          }
        }
      };
    }

    function hBarLabelPlugin() {
      return {
        id: 'hBarLabel',
        afterDraw: function(chart) {
          var ctx = chart.ctx,
            ds = chart.data.datasets[0];
          if (!ds) return;
          var meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data) return;
          ctx.fillStyle = '#17211d';
          ctx.font = 'bold 11px Inter,sans-serif';
          ctx.textAlign = 'left';
          for (var i = 0; i < meta.data.length; i++) {
            var b = meta.data[i],
              v = ds.data[i];
            if (!v) continue;
            ctx.fillText(v, b.x + 8, b.y + 5);
          }
        }
      };
    }

    function lineLabelPlugin() {
      return {
        id: 'lineLabel',
        afterDraw: function(chart) {
          var ctx = chart.ctx,
            meta0 = chart.getDatasetMeta(0);
          if (!meta0 || !meta0.data || !meta0.data.length) return;
          var last = meta0.data.length - 1;
          for (var i = 0; i < chart.data.datasets.length; i++) {
            var ds = chart.data.datasets[i],
              meta = chart.getDatasetMeta(i);
            if (!meta || !meta.data || !meta.data[last]) continue;
            var pt = meta.data[last],
              v = ds.data[last];
            if (!v) continue;
            ctx.fillStyle = ds.borderColor || '#333';
            ctx.font = 'bold 10px Inter,sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(ds.label + ' ' + v, pt.x + 6, pt.y);
          }
        }
      };
    }

    function legendMultiSelect(e, legendItem, legend) {
      if (!legendItem) return;
      var chart = legend.chart;
      var vis = [];
      for (var i = 0; i < chart.data.datasets.length; i++) {
        var meta = chart.getDatasetMeta(i);
        vis.push(!meta.hidden);
      }
      var allVisible = vis.every(function(v) { return v; });
      var idx = legendItem.datasetIndex !== undefined ? legendItem.datasetIndex : legendItem.index;
      if (allVisible) {
        for (var i = 0; i < chart.data.datasets.length; i++) chart.setDatasetVisibility(i, i === idx);
      } else {
        var meta = chart.getDatasetMeta(idx);
        chart.setDatasetVisibility(idx, !!meta.hidden);
        var anyVisible = false;
        for (var i = 0; i < chart.data.datasets.length; i++) { if (chart.getDatasetMeta(i).visible !== false) anyVisible =
          true; }
        if (!anyVisible) {
          for (var i = 0; i < chart.data.datasets.length; i++) chart.setDatasetVisibility(i, true);
        }
      }
      chart.update();
    }

    function renderCalendar() {
      var dataDays = getDataDays();

      dom.calMonthLabel.textContent = MONTHS[calMonth] + ' ' + calYear;
      var grid = dom.calGrid;

      var startDow = (first.getDay() + 6) % 7;
      var lastDate = new Date(calYear, calMonth + 1, 0).getDate();
      var h = '';
      for (var i = 0; i < startDow; i++) h += '<span class="cal-day empty"></span>';
      for (var day = 1; day <= lastDate; day++) {
        var d = new Date(calYear, calMonth, day);
        var key = dayKey(d);
        var cls = ['cal-day'];
        if (dataDays.has(key)) cls.push('has-data');
        if (filters.days.has(key)) cls.push('selected');
        if (key === todayStr) cls.push('today');
        if (hasOtherFilter) {
          var ok = true;
          if (filters.weeks.size > 0 && !filters.weeks.has(weekKey(d))) ok = false;
          if (filters.months.size > 0 && !filters.months.has(monthKey(d))) ok = false;
          if (!ok) cls.push('dimmed');
        }
        h += '<span class="' + cls.join(' ') + '" data-date="' + key + '">' + day + '</span>';
      }
      grid.innerHTML = h;

    // ========================================================================
    // 5. PRODUCT RACE (Phase 3 & 4)
    // ========================================================================
    function buildRaceData() {
      if (cachedRaceData !== null) return cachedRaceData;

      var startStr = dom.raceStartDate.value;
      var startD = startStr ? dparse(startStr + 'T00:00:00') : null;
      var endD = new Date();
      endD.setHours(23, 59, 59, 999);

      var allDays = [];
      if (startD) {
        var cursor = new Date(startD.getTime());
        while (cursor <= endD) {
          allDays.push(dayKey(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }
      }

      var daily = {};
      var prodSet = new Set();
      for (var i = 0; i < allItems.length; i++) {
        var r = allItems[i],
          d = dparse(r.created_at);
        if (!d) continue;
        if (raceSelectedProducts.size > 0 && !raceSelectedProducts.has(r.name)) continue;
        if (startD && d < startD) continue;
        if (d > endD) continue;
        var dk = dayKey(d);
        if (!daily[dk]) daily[dk] = {};
        daily[dk][r.name] = (daily[dk][r.name] || 0) + (Number(r.quantity) || 0);
        prodSet.add(r.name);
      }

      if (!allDays.length) {
        allDays = Object.keys(daily).sort();
      }

      var acc = {};
      var result = [];
      for (var di = 0; di < allDays.length; di++) {
        var dk = allDays[di];
        if (daily[dk]) {
          for (var n in daily[dk]) acc[n] = (acc[n] || 0) + daily[dk][n];
        }
        var leaders = Object.keys(acc).filter(function(p) { return acc[p]; }).map(function(p) {
          return { name: p, value: acc[p] };
        }).sort(function(a, b) { return b.value - a.value; });
        result.push({ date: dk, leaders: leaders });
      }

      cachedRaceData = result;
      return result;
    }

    function initRaceCanvas() {
      var wrap = dom.raceChart.parentNode;
      var canvas = dom.raceChart;
      var rect = wrap.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      raceState.canvas = canvas;
      raceState.ctx = canvas.getContext('2d');
      raceState.ctx.scale(dpr, dpr);

      installRaceResize();
    }

    function installRaceResize() {
      if (raceState.resizeObs) raceState.resizeObs.disconnect();
      var wrap = dom.raceChart.parentNode;
      raceState.resizeObs = new ResizeObserver(function() {
        if (raceState.resizePending) return;
        raceState.resizePending = true;
        requestAnimationFrame(function() {
          raceState.resizePending = false;
          var canvas = dom.raceChart;
          var rect = wrap.getBoundingClientRect();
          var dpr = window.devicePixelRatio || 1;
          if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            raceState.ctx = canvas.getContext('2d');
            raceState.ctx.scale(dpr, dpr);
            if (raceState.bars.length) drawRaceBars();
          }
        });
      });
      raceState.resizeObs.observe(wrap);
    }

    function drawRaceBars() {
      var ctx = raceState.ctx;
      var canvas = raceState.canvas;
      if (!ctx || !canvas) return;
      var dpr = window.devicePixelRatio || 1;
      var W = canvas.width / dpr,
        H = canvas.height / dpr;
      if (!W || !H) return;

      ctx.clearRect(0, 0, W, H);

      var sorted = raceState.bars.slice().sort(function(a, b) { return a.y - b.y; });
      var n = 8;
      var gap = 4;
      var barH = (H - gap * (n - 1)) / n;
      var step = barH + gap;
      var rankW = 26;
      var maxW = 0;
      for (var i = 0; i < sorted.length; i++) { if (sorted[i].targetW > maxW) maxW = sorted[i].targetW; }
      if (!maxW) maxW = 1;
      var labelW = 110;
      var scale = (W - labelW - 10) / maxW;

      // Cached measureText (Phase 3)
      ctx.textBaseline = 'middle';

      for (var i = 0; i < sorted.length; i++) {
        var b = sorted[i];
        var bw = b.w * scale;
        var y = b.y;
        ctx.globalAlpha = b.alpha || 1;

        // Product Name
        ctx.fillStyle = '#17211d';
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'right';
        var name = b.name;
        if (ctx.measureText(name).width > labelW - 8) {
          // Simple truncation or wrap (keeping it simple for performance)
          var truncated = name;
          while (ctx.measureText(truncated + '…').width > labelW - 8 && truncated.length > 1) {
            truncated = truncated.slice(0, -1);
          }
          name = truncated + '…';
        }
        ctx.fillText(name, labelW - 4, y + barH / 2);

        // Bar
        var x = labelW + 6;
        var c = b.color;

        // Cached Gradient (Phase 3)
        var gradKey = c + '_' + bw;
        if (!b.gradCache || b.gradCacheKey !== gradKey) {
          var grad = ctx.createLinearGradient(x, 0, x + bw, 0);
          grad.addColorStop(0, c + 'dd');
          grad.addColorStop(0.7, c + 'cc');
          grad.addColorStop(1, c + '88');
          b.gradCache = grad;
          b.gradCacheKey = gradKey;
        }
        ctx.fillStyle = b.gradCache;
        roundRect(ctx, x, y, bw, barH, 4);
        ctx.fill();

        // Top highlight
        var hgrad = ctx.createLinearGradient(x, y, x, y + barH * 0.4);
        hgrad.addColorStop(0, 'rgba(255,255,255,0.25)');
        hgrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hgrad;
        roundRect(ctx, x, y, bw, barH, 4);
        ctx.fill();

        // Value
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Inter,sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(b.value), x + bw - 8, y + barH / 2);
      }
      ctx.globalAlpha = 1;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function syncRaceBars(target, prevMap) {
      var H = raceState.canvas.height / (window.devicePixelRatio || 1) || 350;
      var gap = 4,
        n = 8;
      var barH = (H - gap * (n - 1)) / n;
      var step = barH + gap;

      var newBars = [];
      for (var i = 0; i < target.length; i++) {
        var t = target[i];
        var prev = prevMap ? prevMap.get(t.name) : null;
        var color = getProductColor(t.name);
        newBars.push({
          name: t.name,
          value: t.value,
          color: color,
          y: prev ? prev.y : i * step,
          targetY: i * step,
          w: prev ? prev.w : 0,
          targetW: t.value,
          alpha: 1,
          gradCache: prev ? prev.gradCache : null,
          gradCacheKey: prev ? prev.gradCacheKey : null,
        });
      }

      if (prevMap) {
        var keep = new Set(target.map(function(t) { return t.name; }));
        prevMap.forEach(function(p, name) {
          if (!keep.has(name)) {
            newBars.push({
              name: name,
              value: p.value || 0,
              color: p.color || '#999',
              y: p.y,
              targetY: H + 20,
              w: p.w || 0,
              targetW: 0,
              alpha: 0,
              gradCache: p.gradCache || null,
              gradCacheKey: p.gradCacheKey || null,
            });
          }
        });
      }

      raceState.bars = newBars;
    }

    function animateRaceBars() {
      var done = true;
      var H = raceState.canvas.height / (window.devicePixelRatio || 1) || 350;
      var gap = 4,
        n = 8;
      var barH = (H - gap * (n - 1)) / n;
      var step = barH + gap;

      for (var i = 0; i < raceState.bars.length; i++) {
        var b = raceState.bars[i];
        b.y += 0.08 * (b.targetY - b.y);
        b.w += 0.08 * (b.targetW - b.w);
        if (b.targetY > H) b.alpha -= (1 - b.alpha) * 0.3 + 0.05;
      }

      raceState.bars.sort(function(a, b) { return a.targetY - b.targetY; });
      for (var i = 0; i < raceState.bars.length; i++) {
        var targetY = i < 8 ? i * step : H + step;
        raceState.bars[i].targetY = targetY;
        if (i > 0) {
          var minY = raceState.bars[i - 1].y + 2;
          if (raceState.bars[i].y < minY) raceState.bars[i].y += (minY - raceState.bars[i].y) * 0.5;
        }
        if (raceState.bars[i].targetY > H) raceState.bars[i].alpha -= (1 - raceState.bars[i].alpha) * 0.3 + 0.05;
        if (Math.abs(targetY - raceState.bars[i].y) > 0.5 || Math.abs(raceState.bars[i].targetW - raceState.bars[i].w) >
          0.5 || (targetY > H && raceState.bars[i].alpha > 0.01)) {
          done = false;
        }
      }

      raceState.bars = raceState.bars.filter(function(b) { return !(b.targetY > H && b.alpha < 0.02); });
      drawRaceBars();

      if (!done) {
        raceState.animId = requestAnimationFrame(animateRaceBars);
      } else {
        raceState.animId = null;
      }
    }

    function applyRaceFrame(target) {
      var prevMap = null;
      if (raceState.bars.length) {
        prevMap = new Map();
        for (var i = 0; i < raceState.bars.length; i++) {
          var b = raceState.bars[i];
          prevMap.set(b.name, { y: b.y, w: b.w, value: b.value, color: b.color, gradCache: b.gradCache,
            gradCacheKey: b.gradCacheKey });
        }
      }
      syncRaceBars(target, prevMap);
      if (raceState.animId) cancelAnimationFrame(raceState.animId);
      animateRaceBars();
    }

    function raceStep() {
      if (!raceState.playing) return;
      var data = buildRaceData();
      var frame = data[raceState.index];
      if (!frame) { racePause(); return; }
      applyRaceFrame(frame.leaders.slice(0, 8));
      dom.raceDateLabel.textContent = frame.date;
      raceState.index++;
      if (raceState.index >= data.length) { racePause(); return; }
      raceState.timer = setTimeout(raceStep, 900);
    }

    function racePlay() {
      var data = buildRaceData();
      if (!data.length) return;
      if (raceState.timer) clearTimeout(raceState.timer);
      if (raceState.animId) cancelAnimationFrame(raceState.animId);
      raceState.bars = [];
      raceState.index = 0;
      raceState.playing = true;
      dom.racePlay.disabled = true;
      dom.racePause.disabled = false;
      dom.raceStop.disabled = false;
      initRaceCanvas();
      raceStep();
    }

    function racePause() {
      raceState.playing = false;
      if (raceState.timer) clearTimeout(raceState.timer);
      if (raceState.bars.length) {
        for (var i = 0; i < raceState.bars.length; i++) {
          raceState.bars[i].y = raceState.bars[i].targetY;
          raceState.bars[i].w = raceState.bars[i].targetW;
        }
        drawRaceBars();
      }
      if (raceState.animId) { cancelAnimationFrame(raceState.animId);
        raceState.animId = null; }
      dom.racePlay.disabled = false;
      dom.racePause.disabled = true;
    }

    function raceStop() {
      raceState.playing = false;
      if (raceState.timer) clearTimeout(raceState.timer);
      if (raceState.animId) cancelAnimationFrame(raceState.animId);
      raceState.bars = [];
      raceState.index = 0;
      raceState.ctx = null;
      dom.racePlay.disabled = false;
      dom.racePause.disabled = true;
      dom.raceStop.disabled = true;

      var data = buildRaceData();
      if (data.length) {
        initRaceCanvas();
        raceState.bars = [];
        applyRaceFrame(data[0].leaders.slice(0, 8));
        dom.raceDateLabel.textContent = data[0].date;
      } else {
        dom.raceDateLabel.textContent = '';
        var ctx = raceState.ctx;
        if (ctx) {
          var canvas = raceState.canvas;
          var dpr = window.devicePixelRatio || 1;
          ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        }
      }
    }

    // ========================================================================
    // 6. MAIN REFRESH & DATA FETCH (Phase 6)
    // ========================================================================
    let refreshTimer = null;
    let lastRefresh = null;

    function showLoading() { dom.loadingBar.style.display = ''; }

    function hideLoading() { dom.loadingBar.style.display = 'none'; }

    function updateRefreshHint() {
      if (!lastRefresh) { dom.refreshHint.textContent = ''; return; }
      var ago = Math.round((Date.now() - lastRefresh.getTime()) / 1000);
      dom.refreshHint.textContent = 'Updated ' + (ago < 60 ? ago + 's ago' : Math.round(ago / 60) + 'm ago') +
        ' · auto-refresh 60s';
    }

    function refreshAll() {
      renderCards();
      updateOrdersChart();
      updateTop5Chart();
      updateTrendChart();
      // Race will be reset by fetchData, or we can let it be.
    }

    async function fetchData() {
      if (!supabase) {
        dom.statusCards.innerHTML =
          '<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
        return;
      }
      showLoading();
      try {
        var res = await supabase.from('order_items').select('*').order('created_at', { ascending: false });
        if (res.error) throw res.error;
        allItems = res.data || [];
        lastRefresh = new Date();

        // Invalidate all caches
        invalidateCache();

        populateProducts();
        populateRaceProducts();
        if (!dom.raceStartDate.value) {
          dom.raceStartDate.value = dayKey(new Date());
        }

        // Reset race
        raceStop();

        refreshAll();
      } catch (e) {
        console.error(e);
        dom.statusCards.innerHTML =
          '<div class="empty-state" style="grid-column:1/-1"><strong>Failed to load</strong><span>' + (e.message || e
            .code || 'Error') + '</span></div>';
      }
      hideLoading();
      updateRefreshHint();
    }

    function initSupabase() {
      var u = CFG.supabaseUrl || '',
        k = CFG.supabaseAnonKey || '';
      if (!u || !k || !window.supabase) return false;
      try { supabase = window.supabase.createClient(u, k); return true; } catch (e) { console.error(e); return false; }
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function() { fetchData(); }, 60000);
      setInterval(function() { updateRefreshHint(); }, 15000);
    }

    // ========================================================================
    // 7. EVENT BINDING (Phase 5)
    // ========================================================================
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October',
      'November', 'December'
    ];

    function closeAllDropdowns(except) {
      var menus = document.querySelectorAll('.product-menu.show, .cal-drop[style*="block"]');
      for (var i = 0; i < menus.length; i++) {
        if (except && menus[i] === except) continue;
        menus[i].classList.remove('show');
        menus[i].style.display = 'none';
      }
      var btns = document.querySelectorAll('.product-toggle-btn.active');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    }

    // Day toggle
    dom.dayToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var cal = dom.dayCalendar;
      var open = cal.style.display === '';
      cal.style.display = open ? 'none' : '';
      this.classList.toggle('active', !open);
      if (!open) {
        closeAllDropdowns(cal);
        if (!calYear) { var now = new Date();
          calYear = now.getFullYear();
          calMonth = now.getMonth(); }
        renderCalendar();
      }
    });

    dom.weekToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var menu = dom.weekCheckboxes;
      var open = menu.classList.toggle('show');
      this.classList.toggle('active', open);
      if (open) { closeAllDropdowns(menu);
        populateCheckboxes('weekCheckboxes', filters.weeks, weekKey); }
    });

    dom.monthToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var menu = dom.monthCheckboxes;
      var open = menu.classList.toggle('show');
      this.classList.toggle('active', open);
      if (open) { closeAllDropdowns(menu);
        populateCheckboxes('monthCheckboxes', filters.months, monthKey); }
    });

    dom.weekCheckboxes.addEventListener('change', function(e) {
      if (e.target.classList.contains('cb-sa')) {
        var cbs = document.querySelectorAll('#weekCheckboxes input.cb-item');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = e.target.checked;
      }
      if (e.target.type === 'checkbox') { syncCheckboxSet('weekCheckboxes', filters.weeks);
        invalidateCache();
        refreshAll(); }
    });

    dom.monthCheckboxes.addEventListener('change', function(e) {
      if (e.target.classList.contains('cb-sa')) {
        var cbs = document.querySelectorAll('#monthCheckboxes input.cb-item');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = e.target.checked;
      }
      if (e.target.type === 'checkbox') { syncCheckboxSet('monthCheckboxes', filters.months);
        invalidateCache();
        refreshAll(); }
    });

    dom.calGrid.addEventListener('click', function(e) {
      var day = e.target.closest('.cal-day');
      if (!day || day.classList.contains('empty')) return;
      toggleCalDate(day.dataset.date);
    });

    dom.calPrev.addEventListener('click', function(e) {
      e.stopPropagation();
      if (calMonth === 0) { calMonth = 11;
        calYear--; } else calMonth--;
      renderCalendar();
    });

    dom.calNext.addEventListener('click', function(e) {
      e.stopPropagation();
      if (calMonth === 11) { calMonth = 0;
        calYear++; } else calMonth++;
      renderCalendar();
    });

    dom.calClear.addEventListener('click', function(e) {
      e.stopPropagation();
      filters.days.clear();
      invalidateCache();
      renderCalendar();
      refreshAll();
    });

    dom.productToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var menu = dom.productCheckboxes;
      var open = menu.classList.toggle('show');
      this.classList.toggle('active', open);
    });

    dom.productCheckboxes.addEventListener('change', function(e) {
      if (e.target.classList.contains('select-all-cb')) {
        var checked = e.target.checked;
        var cbs = document.querySelectorAll('#productCheckboxes input.product-cb');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
      }
      if (e.target.type === 'checkbox') { readProductChecked();
        invalidateCache();
        refreshAll(); }
    });

    dom.clearFilterBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      clearAllFilters();
    });

    dom.raceProdToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var menu = dom.raceProdCheckboxes;
      var open = menu.classList.toggle('show');
      this.classList.toggle('active', open);
    });

    dom.raceProdCheckboxes.addEventListener('change', function(e) {
      if (e.target.classList.contains('cb-sa')) {
        var checked = e.target.checked;
        var cbs = document.querySelectorAll('#raceProdCheckboxes input.cb-item');
        for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
      }
      if (e.target.type === 'checkbox') syncRaceProducts();
    });

    dom.racePlay.addEventListener('click', function(e) { e.stopPropagation();
      racePlay(); });
    dom.racePause.addEventListener('click', function(e) { e.stopPropagation();
      racePause(); });
    dom.raceStop.addEventListener('click', function(e) { e.stopPropagation();
      raceStop(); });

    dom.refreshDashBtn.addEventListener('click', function() { fetchData(); });

    document.addEventListener('click', function(e) {
      var inDropdown = e.target.closest('.filter-dropdown');
      if (!inDropdown) {
        var menus = document.querySelectorAll('.product-menu.show');
        for (var i = 0; i < menus.length; i++) menus[i].classList.remove('show');
        var cal = dom.dayCalendar;
        if (cal) cal.style.display = 'none';
        var btns = document.querySelectorAll('.product-toggle-btn.active');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      }
    });

    // ========================================================================
    // 8. INIT
    // ========================================================================
    if (initSupabase()) {
      fetchData();
      startAutoRefresh();
    } else {
      dom.statusCards.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
    }

  })();
</script>
</body>
</html>
