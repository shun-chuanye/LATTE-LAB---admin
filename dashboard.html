<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LATTE LAB · Dashboard</title>
<link rel="icon" href="image/logo.JPG" />
<style>
:root {
  --bg: #f7f8f4; --surface: #ffffff; --surface-2: #edf5f0; --ink: #17211d;
  --muted: #66746c; --line: #dce5dd; --brand: #0f5c4d; --accent: #d86f45;
  --danger: #b33939; --radius: 8px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100%; margin: 0;
  background: linear-gradient(180deg, rgba(15,92,77,0.06), transparent 360px), var(--bg);
  color: var(--ink); padding: 18px 18px 48px;
}
.app-shell { width: min(1280px, 100%); margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0 18px; flex-wrap: wrap; }
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 50px; height: 50px; border-radius: var(--radius); object-fit: cover; border: 1px solid rgba(23,33,29,0.12); background: var(--surface); }
.brand-lockup h1 { margin: 0; font-size: 1.5rem; line-height: 1; }
.brand-lockup .eyebrow { margin: 0 0 2px; color: var(--accent); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
.back-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--brand); text-decoration: none;
  font-size: 0.82rem; font-weight: 800; box-shadow: 0 4px 14px rgba(23,33,29,0.06);
}
.back-btn:hover { background: var(--surface-2); }

.filter-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface);
}
.filter-bar label { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.filter-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.filter-bar select {
  height: 34px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--bg); color: var(--ink); font-weight: 500; min-width: 100px;
}
.date-picker {
  height: 34px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--bg); color: var(--ink); font-weight: 500; min-width: 150px;
}

.day-calendar {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 8px; width: 240px;
  box-shadow: 0 6px 18px rgba(23,33,29,0.1);
}
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 0 6px;
}
.cal-month { font-size: 0.8rem; font-weight: 800; color: var(--ink); }
.cal-arrow {
  width: 24px; height: 24px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); font-size: 0.7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cal-arrow:hover { background: var(--surface-2); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 2px 0 4px; }
.cal-weekdays span { font-size: 0.6rem; font-weight: 800; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 600; border-radius: 4px; cursor: pointer;
  color: var(--muted); border: 1px solid transparent; min-height: 28px;
}
.cal-day:hover { background: var(--surface-2); border-color: var(--line); }
.cal-day.has-data { color: var(--ink); font-weight: 700; }
.cal-day.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
.cal-day.dimmed { opacity: 0.3; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day.empty { cursor: default; }
.cal-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 1px 0; font-size: 0.65rem; color: var(--muted);
}
.cal-clear { border: 0; background: none; color: var(--danger); font-size: 0.65rem; font-weight: 700; cursor: pointer; }
.cal-clear:hover { text-decoration: underline; }
.product-dropdown { position: relative; }
.product-toggle-btn {
  height: 34px; padding: 0 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); color: var(--ink);
  font-size: 0.78rem; font-weight: 700; cursor: pointer;
}
.product-toggle-btn:hover { background: var(--surface-2); }
.product-toggle-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.product-menu {
  position: absolute; top: 100%; left: 0; z-index: 10; margin-top: 4px;
  max-height: 200px; min-width: 180px; box-shadow: 0 8px 24px rgba(23,33,29,0.15);
  display: none;
}
.product-menu.show { display: flex; }
.product-menu .select-all { font-weight: 800; color: var(--brand); padding: 4px; border-radius: 4px; }
.product-menu .select-all:hover { background: var(--surface-2); }
.product-menu .menu-sep { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
.period-btns { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.period-btns button {
  padding: 6px 14px; border: 0; background: var(--surface); color: var(--muted);
  font-size: 0.74rem; font-weight: 700; cursor: pointer;
}
.period-btns button.active { background: var(--brand); color: #fff; }
.period-btns button:not(.active):hover { background: var(--surface-2); }
.filter-bar .spacer { flex: 1; min-width: 10px; }

.period-checkboxes {
  max-height: 140px; overflow-y: auto; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); padding: 6px 8px;
  min-width: 160px; display: none; flex-direction: column; gap: 2px;
}
.period-checkboxes.show { display: flex; }
.period-checkboxes label {
  display: flex; align-items: center; gap: 6px; font-size: 0.75rem;
  font-weight: 500; color: var(--ink); padding: 2px 4px; border-radius: 4px; cursor: pointer;
}
.period-checkboxes label:hover { background: var(--surface-2); }
.period-checkboxes input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; }

.status-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.status-card {
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: 0 4px 14px rgba(23,33,29,0.04); text-align: center;
}
.status-card .label { color: var(--muted); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
.status-card .value { font-size: 1.6rem; font-weight: 900; color: var(--brand); line-height: 1.2; margin-top: 2px; }
.status-card.today .value { color: #1a4b8c; }
.status-card.week .value { color: #0f5c4d; }
.status-card.month .value { color: #d86f45; }
.status-card.total .value { color: var(--ink); }
.status-card.nw .value { color: #e65100; }
.status-card.ok .value { color: #2e7d32; }

.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 20px; }
.chart-card {
  padding: 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: 0 4px 20px rgba(23,33,29,0.05);
}
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { margin: 0 0 14px; font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
.chart-card .chart-wrap { position: relative; width: 100%; height: 300px; }
.donut-card .chart-wrap { height: 420px; }
.chart-card .chart-wrap canvas { width: 100% !important; height: 100% !important; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty-state strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 8px; }

@media (max-width: 720px) {
  body { padding: 12px 12px 32px; }
  .charts-grid { grid-template-columns: 1fr; }
  .status-cards { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .status-card { padding: 10px 12px; }
  .status-card .value { font-size: 1.2rem; }
  .brand-lockup h1 { font-size: 1.2rem; }
  .brand-logo { width: 40px; height: 40px; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-bar select { min-width: 0; width: 100%; }
  .filter-bar .spacer { display: none; }
  .chart-card .chart-wrap { height: 250px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-lockup">
      <img class="brand-logo" src="image/logo.JPG" alt="LATTE LAB" />
      <div><p class="eyebrow">Admin · Dashboard</p><h1>LATTE LAB</h1></div>
    </div>
    <a class="back-btn" href="index.html">Back to Orders</a>
  </header>

  <div class="filter-bar">
    <span class="filter-label">Filter</span>
    <div class="period-btns" id="periodBtns">
      <button data-period="all" class="active">All</button>
      <button data-period="day">Day</button>
      <button data-period="week">Week</button>
      <button data-period="month">Month</button>
    </div>
    <div id="periodCheckboxes" class="period-checkboxes"></div>
    <div id="dayCalendar" class="day-calendar" style="display:none;">
      <div class="cal-header">
        <button type="button" class="cal-arrow" id="calPrev">◀</button>
        <span class="cal-month" id="calMonthLabel"></span>
        <button type="button" class="cal-arrow" id="calNext">▶</button>
      </div>
      <div class="cal-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-footer"><span id="calCount">0 selected</span> · <button type="button" class="cal-clear" id="calClear">Clear</button></div>
    </div>
    <div class="product-dropdown">
      <button id="productToggle" class="product-toggle-btn">Product ▾</button>
      <div id="productCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="status-cards" id="statusCards"></div>

  <div class="charts-grid">
    <div class="chart-card full"><h3>Orders Over Time</h3><div class="chart-wrap"><canvas id="ordersChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products</h3><div class="chart-wrap"><canvas id="topProductsChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products · Daily Trend</h3><div class="chart-wrap"><canvas id="productTrendChart"></canvas></div></div>
    <div class="chart-card full donut-card"><h3>Product Distribution</h3><div class="chart-wrap"><canvas id="productDonutChart"></canvas></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
(function() {
  "use strict";
  var CFG = window.LATTE_LAB_CONFIG || {};
  var supabase = null;
  var charts = {};
  var allItems = [];
  var activePeriod = 'all';
  var weekSelected = new Set();
  var monthSelected = new Set();
  var activeProductValues = new Set();
  var calMonth, calYear, calSelected = new Set();

  // ---------- date helpers ----------
  function pad(n) { return String(n).padStart(2,'0'); }
  function dparse(s) { if(!s) return null; var d=new Date(s); return isNaN(d.getTime())?null:d; }
  function dayKey(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function weekKey(d) {
    var dow=d.getDay(), off=d.getDate()-dow+(dow===0?-6:1);
    var mon=new Date(d.getFullYear(),d.getMonth(),off);
    var t=new Date(d.valueOf()), dn=(d.getDay()+6)%7;
    t.setDate(t.getDate()-dn+3);
    var ft=new Date(t.getFullYear(),0,4);
    var wk=Math.round((t.getTime()-ft.getTime())/604800000)+1;
    return mon.getFullYear()+'-W'+pad(wk);
  }
  function monthKey(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1); }

  // ---------- group items → orders ----------
  function getOrders(items) {
    var map={};
    for(var i=0;i<items.length;i++){
      var r=items[i], k=r.client_order_id;
      if(!map[k]) map[k]={cid:k,created_at:r.created_at,status:r.status,fm:r.fulfillment_method};
    }
    return Object.values(map);
  }

  // ---------- filter ----------
  function matchPeriod(r) {
    if(activePeriod==='all') return true;
    var d=dparse(r.created_at); if(!d) return false;
    // all active filters must allow this row
    if(calSelected.size>0 && !calSelected.has(dayKey(d))) return false;
    if(weekSelected.size>0 && !weekSelected.has(weekKey(d))) return false;
    if(monthSelected.size>0 && !monthSelected.has(monthKey(d))) return false;
    return true;
  }

  function getFilteredItems() {
    return allItems.filter(function(r){
      if(activeProductValues.size>0&&!activeProductValues.has(r.name)) return false;
      return matchPeriod(r);
    });
  }

  function populateCheckboxes() {
    var box=document.getElementById('periodCheckboxes');
    var keys={};
    var prevChecked=activePeriod==='week'?weekSelected:monthSelected;
    for(var i=0;i<allItems.length;i++){
      var d=dparse(allItems[i].created_at); if(!d) continue;
      var k;
      if(activePeriod==='week') k=weekKey(d);
      else if(activePeriod==='month') k=monthKey(d);
      else continue;
      keys[k]=true;
    }
    var sorted=Object.keys(keys).sort().reverse();
    var h='';
    for(var j=0;j<sorted.length;j++){
      var v=sorted[j], lbl;
      if(activePeriod==='week') lbl=v.replace('-W',' W');
      else lbl=v;
      var ck=prevChecked.has(v)?' checked':'';
      h+='<label><input type="checkbox" value="'+v+'"'+ck+'> '+lbl+'</label>';
    }
    box.innerHTML=h;
    readChecked();
  }

  function readChecked() {
    if(activePeriod==='week') weekSelected.clear(); else monthSelected.clear();
    var cbs=document.querySelectorAll('#periodCheckboxes input[type="checkbox"]');
    for(var i=0;i<cbs.length;i++){
      if(cbs[i].checked){
        if(activePeriod==='week') weekSelected.add(cbs[i].value);
        else monthSelected.add(cbs[i].value);
      }
    }
  }

  function switchPeriod(p) {
    if(p===activePeriod) return;
    activePeriod=p;
    var btns=document.querySelectorAll('#periodBtns button');
    for(var b=0;b<btns.length;b++) btns[b].classList.toggle('active',btns[b].dataset.period===p);
    var cb=document.getElementById('periodCheckboxes');
    var cal=document.getElementById('dayCalendar');
    if(p==='all'){
      cb.classList.remove('show'); cal.style.display='none';
      calSelected.clear(); weekSelected.clear(); monthSelected.clear();
    }else if(p==='day'){
      cb.classList.remove('show'); cal.style.display='';
      if(!calYear){var now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();}
      renderCalendar();
    }else{
      cal.style.display='none'; cb.classList.add('show'); populateCheckboxes();
    }
    refreshAll();
  }

  // ---------- status cards ----------
  function renderCards() {
    var items=getFilteredItems(), orders=getOrders(items);
    var nw=0, ok=0;
    for(var i=0;i<orders.length;i++){
      if(orders[i].status==='new') nw++;
      else if(orders[i].status==='completed') ok++;
    }
    var aOrders=getOrders(allItems), now=new Date();
    var td=0, wk=0, mo=0;
    var tk=dayKey(now), wkK=weekKey(now), mk=monthKey(now);
    for(var i=0;i<aOrders.length;i++){
      var d=dparse(aOrders[i].created_at); if(!d) continue;
      if(dayKey(d)===tk) td++;
      if(weekKey(d)===wkK) wk++;
      if(monthKey(d)===mk) mo++;
    }
    var html='';
    var cards=[
      {l:'Today',v:td,c:'today'},{l:'This Week',v:wk,c:'week'},{l:'This Month',v:mo,c:'month'},
      {l:'Total',v:aOrders.length,c:'total'},{l:'New',v:nw,c:'nw'},{l:'Completed',v:ok,c:'ok'}
    ];
    for(var i=0;i<cards.length;i++){
      html+='<div class="status-card '+cards[i].c+'"><div class="label">'+cards[i].l+'</div><div class="value">'+cards[i].v+'</div></div>';
    }
    document.getElementById('statusCards').innerHTML=html;
  }

  function populateProducts() {
    var names={}, prev=[];
    var existing=document.querySelectorAll('#productCheckboxes input.product-cb');
    for(var i=0;i<existing.length;i++){if(existing[i].checked) prev.push(existing[i].value);}
    for(var i=0;i<allItems.length;i++) names[allItems[i].name]=true;
    var ks=Object.keys(names).sort();
    var allChecked=prev.length===ks.length;
    var h='<label class="select-all"><input type="checkbox" class="select-all-cb"'+ (allChecked?' checked':'') +'> Select All</label><hr class="menu-sep">';
    for(var j=0;j<ks.length;j++){
      var ck=prev.indexOf(ks[j])>=0?' checked':'';
      h+='<label><input type="checkbox" class="product-cb" value="'+ks[j]+'"'+ck+'> '+ks[j]+'</label>';
    }
    document.getElementById('productCheckboxes').innerHTML=h;
    readProductChecked();
  }

  function readProductChecked() {
    activeProductValues.clear();
    var cbs=document.querySelectorAll('#productCheckboxes input.product-cb');
    for(var i=0;i<cbs.length;i++){if(cbs[i].checked) activeProductValues.add(cbs[i].value);}
  }

  // ---------- calendar ----------
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getDataDays() {
    var set=new Set();
    for(var i=0;i<allItems.length;i++){
      var d=dparse(allItems[i].created_at); if(!d) continue;
      set.add(dayKey(d));
    }
    return set;
  }

  function renderCalendar() {
    var dataDays=getDataDays();
    var todayStr=dayKey(new Date());
    var hasOtherFilter=weekSelected.size>0||monthSelected.size>0;
    var label=document.getElementById('calMonthLabel');
    label.textContent=MONTHS[calMonth]+' '+calYear;

    var grid=document.getElementById('calGrid');
    var first=new Date(calYear,calMonth,1);
    var startDow=(first.getDay()+6)%7;
    var lastDate=new Date(calYear,calMonth+1,0).getDate();

    var h='';
    for(var i=0;i<startDow;i++) h+='<span class="cal-day empty"></span>';
    for(var day=1;day<=lastDate;day++){
      var d=new Date(calYear,calMonth,day);
      var key=dayKey(d);
      var cls=['cal-day'];
      if(dataDays.has(key)) cls.push('has-data');
      if(calSelected.has(key)) cls.push('selected');
      if(key===todayStr) cls.push('today');
      // dim if other filters active and this date doesn't match
      if(hasOtherFilter){
        var ok=true;
        if(weekSelected.size>0&&!weekSelected.has(weekKey(d))) ok=false;
        if(monthSelected.size>0&&!monthSelected.has(monthKey(d))) ok=false;
        if(!ok) cls.push('dimmed');
      }
      h+='<span class="'+cls.join(' ')+'" data-date="'+key+'">'+day+'</span>';
    }
    grid.innerHTML=h;

    var calCount=document.getElementById('calCount');
    var total=weekSelected.size+monthSelected.size+calSelected.size;
    calCount.textContent=calSelected.size+' selected'+(total>calSelected.size?' (filtered)':'');
  }

  function toggleCalDate(dateKey) {
    if(calSelected.has(dateKey)) calSelected.delete(dateKey);
    else calSelected.add(dateKey);
    renderCalendar();
    refreshAll();
  }

  // ---------- data label plugin ----------
  function barLabelPlugin() {
    return {
      id:'barLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, ds=chart.data.datasets[0];
        if(!ds) return;
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data) return;
        for(var i=0;i<meta.data.length;i++){
          var b=meta.data[i], v=ds.data[i];
          if(!v) continue;
          ctx.fillStyle='#17211d'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='center';
          ctx.fillText(v, b.x, b.y-8);
        }
      }
    };
  }

  function hBarLabelPlugin() {
    return {
      id:'hBarLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, ds=chart.data.datasets[0];
        if(!ds) return;
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data) return;
        for(var i=0;i<meta.data.length;i++){
          var b=meta.data[i], v=ds.data[i];
          if(!v) continue;
          ctx.fillStyle='#17211d'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='left';
          ctx.fillText(v, b.x+8, b.y+5);
        }
      }
    };
  }

  function lineLabelPlugin() {
    return {
      id:'lineLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, meta0=chart.getDatasetMeta(0);
        if(!meta0||!meta0.data||!meta0.data.length) return;
        var last=meta0.data.length-1;
        for(var i=0;i<chart.data.datasets.length;i++){
          var ds=chart.data.datasets[i], meta=chart.getDatasetMeta(i);
          if(!meta||!meta.data||!meta.data[last]) continue;
          var pt=meta.data[last], v=ds.data[last];
          if(!v) continue;
          ctx.fillStyle=ds.borderColor||'#333'; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='left';
          ctx.fillText(ds.label+' '+v, pt.x+6, pt.y);
        }
      }
    };
  }

  function donutLabelPlugin() {
    return {
      id:'donutLabel',
      afterDraw:function(chart){
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data||!meta.data.length) return;
        var ds=chart.data.datasets[0], total=0;
        for(var i=0;i<ds.data.length;i++) total+=ds.data[i]||0;
        if(!total) return;
        var ctx=chart.ctx;
        for(var i=0;i<meta.data.length;i++){
          var arc=meta.data[i], v=ds.data[i], lbl=chart.data.labels[i];
          if(!v||!lbl) continue;
          var pct=Math.round(v/total*100);
          // value inside arc
          var angle=(arc.startAngle+arc.endAngle)/2;
          var midR=arc.outerRadius*0.6;
          var mx=arc.x+Math.cos(angle)*midR, my=arc.y+Math.sin(angle)*midR;
          ctx.fillStyle='#fff'; ctx.font='bold 12px Inter,sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(v, mx, my);
          // line + label outside (stagger distances to avoid overlap)
          if(pct<3) continue;
          var stagger=(i%3)*18; // offset even/odd for spacing
          var outerX=arc.x+Math.cos(angle)*arc.outerRadius;
          var outerY=arc.y+Math.sin(angle)*arc.outerRadius;
          var midX=arc.x+Math.cos(angle)*(arc.outerRadius+12+stagger);
          var midY=arc.y+Math.sin(angle)*(arc.outerRadius+12+stagger);
          var textX=arc.x+Math.cos(angle)*(arc.outerRadius+22+stagger);
          var textY=arc.y+Math.sin(angle)*(arc.outerRadius+22+stagger);
          // line
          ctx.beginPath();
          ctx.moveTo(outerX, outerY);
          ctx.lineTo(midX, midY);
          ctx.lineTo(textX, textY);
          ctx.strokeStyle='rgba(23,33,29,0.25)';
          ctx.lineWidth=1;
          ctx.stroke();
          // label
          ctx.fillStyle='#17211d'; ctx.font='11px Inter,sans-serif';
          var ha=textX>arc.x?'left':'right';
          ctx.textAlign=ha; ctx.textBaseline='middle';
          if(ha==='right') textX+=5; else textX-=5;
          ctx.fillText(lbl+' ('+pct+'%)', textX, textY);
        }
      }
    };
  }

  // ---------- legend: multi-select with single-click hide-others ----------
   function legendMultiSelect(e, legendItem, legend) {
     if(!legendItem) return;
     var chart=legend.chart;
     var vis=[];
     for(var i=0;i<chart.data.datasets.length;i++){
       var meta=chart.getDatasetMeta(i);
       vis.push(!meta.hidden);
     }
     var allVisible=vis.every(function(v){return v;});
     var idx=legendItem.datasetIndex!==undefined?legendItem.datasetIndex:legendItem.index;
     if(allVisible){
       for(var i=0;i<chart.data.datasets.length;i++) chart.setDatasetVisibility(i, i===idx);
     }else{
       var meta=chart.getDatasetMeta(idx);
       chart.setDatasetVisibility(idx, !!meta.hidden);
       var anyVisible=false;
       for(var i=0;i<chart.data.datasets.length;i++){if(chart.getDatasetMeta(i).visible!==false) anyVisible=true;}
       if(!anyVisible){
         for(var i=0;i<chart.data.datasets.length;i++) chart.setDatasetVisibility(i, true);
       }
     }
     chart.update();
   }

   function legendSingleselect(e, legendItem, legend) {
      if(!legendItem) return;
      var chart=legend.chart;
      var idx=legendItem.index!==undefined?legendItem.index:0;
      var visCount=0;
      for(var i=0;i<chart.data.labels.length;i++){if(chart.getDataVisibility(i)) visCount++;}
      if(visCount===1&&chart.getDataVisibility(idx)){
        for(var i=0;i<chart.data.labels.length;i++) chart.setDataVisibility(i, true);
      }else{
        for(var i=0;i<chart.data.labels.length;i++) chart.setDataVisibility(i, i===idx);
      }
      chart.update();
    }
  function chartOrders() {
    if(charts.orders) charts.orders.destroy();
    var orders=getOrders(getFilteredItems()), map={};
    for(var i=0;i<orders.length;i++){
      var d=dparse(orders[i].created_at); if(!d) continue;
      var k=dayKey(d); map[k]=(map[k]||0)+1;
    }
    var keys=Object.keys(map).sort();
    var labels=[], data=[];
    for(var j=0;j<keys.length;j++){labels.push(keys[j].slice(5));data.push(map[keys[j]]);}
    var ctx=document.getElementById('ordersChart').getContext('2d');
    charts.orders=new Chart(ctx,{
      type:'bar',
      data:{labels:labels,datasets:[{label:'Orders',data:data,backgroundColor:'rgba(15,92,77,0.7)',borderColor:'#0f5c4d',borderWidth:1,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}},
      plugins:[barLabelPlugin()]
    });
  }

  function chartTop5() {
    if(charts.top5) charts.top5.destroy();
    var items=getFilteredItems(), map={};
    for(var i=0;i<items.length;i++){var n=items[i].name;map[n]=(map[n]||0)+(Number(items[i].quantity)||0);}
    var ents=Object.entries(map).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
    var labels=[], data=[];
    for(var j=0;j<ents.length;j++){labels.push(ents[j][0]);data.push(ents[j][1]);}
    var colors=['rgba(15,92,77,0.85)','rgba(30,100,85,0.78)','rgba(50,120,100,0.7)','rgba(80,140,115,0.62)','rgba(120,170,140,0.55)'];
    var ctx=document.getElementById('topProductsChart').getContext('2d');
    charts.top5=new Chart(ctx,{
      type:'bar',
      data:{labels:labels,datasets:[{label:'Qty',data:data,backgroundColor:colors.slice(0,data.length),borderWidth:1,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}}}},
      plugins:[hBarLabelPlugin()]
    });
  }

  function chartTrend() {
    if(charts.trend) charts.trend.destroy();
    var qty={};
    for(var i=0;i<allItems.length;i++){var n=allItems[i].name;qty[n]=(qty[n]||0)+(Number(allItems[i].quantity)||0);}
    var top5=Object.entries(qty).sort(function(a,b){return b[1]-a[1];}).slice(0,5).map(function(e){return e[0];});
    var items=getFilteredItems(), daily={}, days=new Set();
    for(var i=0;i<items.length;i++){
      var r=items[i], d=dparse(r.created_at); if(!d) continue;
      var dk=dayKey(d); days.add(dk);
      if(top5.indexOf(r.name)<0) continue;
      if(!daily[r.name]) daily[r.name]={};
      daily[r.name][dk]=(daily[r.name][dk]||0)+(Number(r.quantity)||0);
    }
    var dArr=Array.from(days).sort();
    var colors=['#0f5c4d','#d86f45','#1a4b8c','#a8641a','#b33939'];
    var datasets=[];
    for(var i=0;i<top5.length;i++){
      var nm=top5[i];
      datasets.push({
        label:nm,data:dArr.map(function(d){return daily[nm]&&daily[nm][d]||0;}),
        borderColor:colors[i],backgroundColor:colors[i]+'22',borderWidth:2,tension:0.3,fill:false,pointRadius:3
      });
    }
    var ctx=document.getElementById('productTrendChart').getContext('2d');
    charts.trend=new Chart(ctx,{
      type:'line',
      data:{labels:dArr.map(function(d){return d.slice(5);}),datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20,right:60,bottom:10}},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:16,font:{size:11}},onClick:legendMultiSelect}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}},
      plugins:[lineLabelPlugin()]
    });
  }

  function chartDonut() {
    if(charts.donut) charts.donut.destroy();
    var items=getFilteredItems(), map={};
    for(var i=0;i<items.length;i++){var n=items[i].name;map[n]=(map[n]||0)+(Number(items[i].quantity)||0);}
    var ents=Object.entries(map).sort(function(a,b){return b[1]-a[1];});
    var labels=[], data=[];
    for(var j=0;j<ents.length;j++){labels.push(ents[j][0]);data.push(ents[j][1]);}
    var pcolors=['#0f5c4d','#d86f45','#1a4b8c','#a8641a','#b33939','#2e7d32','#6a1b9a','#00695c','#bf360c','#4a148c'];
    var bg=[];
    for(var k=0;k<data.length;k++) bg.push(pcolors[k%pcolors.length]);
    var ctx=document.getElementById('productDonutChart').getContext('2d');
    charts.donut=new Chart(ctx,{
      type:'doughnut',
      data:{labels:labels,datasets:[{data:data,backgroundColor:bg,borderWidth:1,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:30,bottom:20}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:12,font:{size:10}},onClick:legendSingleselect},tooltip:{callbacks:{label:function(c){var t=0;for(var i=0;i<c.dataset.data.length;i++)t+=c.dataset.data[i]||0;var p=t?Math.round(c.raw/t*100):0;return c.label+': '+c.raw+' ('+p+'%)';}}}}},
      plugins:[donutLabelPlugin()]
    });
  }

  function refreshAll() {
    try{renderCards();}catch(e){console.error('cards',e);}
    populateProducts();
    try{chartOrders();}catch(e){console.error('orders',e);}
    try{chartTop5();}catch(e){console.error('top5',e);}
    try{chartTrend();}catch(e){console.error('trend',e);}
    try{chartDonut();}catch(e){console.error('donut',e);}
  }

  // ---------- fetch ----------
  async function fetchData() {
    if(!supabase){
      document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
      return;
    }
    try{
      var res=await supabase.from('order_items').select('*').order('created_at',{ascending:false});
      if(res.error) throw res.error;
      allItems=res.data||[];
      if(activePeriod!=='all') populateCheckboxes();
      refreshAll();
    }catch(e){
      console.error(e);
      document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Failed to load</strong><span>'+(e.message||e.code||'Error')+'</span></div>';
    }
  }

  function initSupabase(){
    var u=CFG.supabaseUrl||'', k=CFG.supabaseAnonKey||'';
    if(!u||!k||!window.supabase) return false;
    try{supabase=window.supabase.createClient(u,k);return true;}catch(e){console.error(e);return false;}
  }

  // ---------- events ----------
  document.getElementById('periodBtns').addEventListener('click',function(e){
    if(e.target.tagName!=='BUTTON') return;
    switchPeriod(e.target.dataset.period);
  });
  document.getElementById('periodCheckboxes').addEventListener('change',function(e){
    if(e.target.type==='checkbox'){readChecked();refreshAll();}
  });
  // calendar events
  document.getElementById('calGrid').addEventListener('click',function(e){
    var day=e.target.closest('.cal-day');
    if(!day||day.classList.contains('empty')) return;
    toggleCalDate(day.dataset.date);
  });
  document.getElementById('calPrev').addEventListener('click',function(e){
    e.stopPropagation();
    if(calMonth===0){calMonth=11;calYear--;}else calMonth--;
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click',function(e){
    e.stopPropagation();
    if(calMonth===11){calMonth=0;calYear++;}else calMonth++;
    renderCalendar();
  });
  document.getElementById('calClear').addEventListener('click',function(e){
    e.stopPropagation();
    calSelected.clear(); renderCalendar(); refreshAll();
  });
  document.getElementById('productToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var menu=document.getElementById('productCheckboxes');
    var open=menu.classList.toggle('show');
    this.classList.toggle('active',open);
  });
  document.getElementById('productCheckboxes').addEventListener('change',function(e){
    if(e.target.classList.contains('select-all-cb')){
      var checked=e.target.checked;
      var cbs=document.querySelectorAll('#productCheckboxes input.product-cb');
      for(var i=0;i<cbs.length;i++) cbs[i].checked=checked;
    }
    if(e.target.type==='checkbox'){readProductChecked();refreshAll();}
  });
  document.addEventListener('click',function(e){
    var dd=document.querySelector('.product-dropdown');
    if(dd&&!dd.contains(e.target)){
      document.getElementById('productCheckboxes').classList.remove('show');
      document.getElementById('productToggle').classList.remove('active');
    }
  });

  // ---------- start ----------
  if(initSupabase()) fetchData();
  else document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
})();
</script>
