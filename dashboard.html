<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LATTE LAB · Dashboard</title>
<link rel="icon" href="image/logo.JPG" />
<style>
:root {
  --bg: #f7f8f4; --surface: #ffffff; --surface-2: #edf5f0; --ink: #17211d;
  --muted: #66746c; --line: #dce5dd; --brand: #0f5c4d; --accent: #d86f45;
  --danger: #b33939; --radius: 8px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100%; margin: 0;
  background: linear-gradient(180deg, rgba(15,92,77,0.06), transparent 360px), var(--bg);
  color: var(--ink); padding: 18px 18px 48px;
}
.app-shell { width: min(1280px, 100%); margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0 18px; flex-wrap: wrap; }
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 50px; height: 50px; border-radius: var(--radius); object-fit: cover; border: 1px solid rgba(23,33,29,0.12); background: var(--surface); }
.brand-lockup h1 { margin: 0; font-size: 1.5rem; line-height: 1; }
.back-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--brand); text-decoration: none;
  font-size: 0.82rem; font-weight: 800; box-shadow: 0 4px 14px rgba(23,33,29,0.06);
}
.back-btn:hover { background: var(--surface-2); }
.filter-bar {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface);
}
.filter-scroll { display: flex; align-items: center; gap: 8px; }
.filter-dropdown { position: relative; }
.product-toggle-btn {
  height: 34px; padding: 0 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); color: var(--ink);
  font-size: 0.78rem; font-weight: 700; cursor: pointer;
}
.product-toggle-btn:hover { background: var(--surface-2); }
.product-toggle-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.clear-filter-btn { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; padding: 0 10px !important; font-size: 0.72rem !important; height: 32px; }
.clear-filter-btn:hover { opacity: 0.85 !important; background: var(--danger) !important; }
.product-menu {
  position: absolute; top: 100%; left: 0; z-index: 100; margin-top: 4px;
  max-height: 200px; min-width: 180px; box-shadow: 0 8px 24px rgba(23,33,29,0.15);
  display: none;
}
.product-menu.show { display: flex; }
.period-checkboxes {
  max-height: 180px; overflow-y: auto; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); padding: 6px 8px;
  min-width: 160px; display: none; flex-direction: column; gap: 2px;
}
.period-checkboxes.show { display: flex; }
.period-checkboxes label {
  display: flex; align-items: center; gap: 6px; font-size: 0.75rem;
  font-weight: 500; color: var(--ink); padding: 2px 4px; border-radius: 4px; cursor: pointer;
}
.period-checkboxes label:hover { background: var(--surface-2); }
.period-checkboxes input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; }
.period-checkboxes .select-all { font-weight: 800; color: var(--brand); }
.period-checkboxes .menu-sep { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
.day-calendar {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 8px; width: 240px;
  box-shadow: 0 6px 18px rgba(23,33,29,0.1);
}
.cal-drop { position: absolute; top: 100%; left: 0; z-index: 100; margin-top: 4px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 0 6px; }
.cal-month { font-size: 0.8rem; font-weight: 800; color: var(--ink); }
.cal-arrow {
  width: 24px; height: 24px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); font-size: 0.7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cal-arrow:hover { background: var(--surface-2); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 2px 0 4px; }
.cal-weekdays span { font-size: 0.6rem; font-weight: 800; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 600; border-radius: 4px; cursor: pointer;
  color: var(--muted); border: 1px solid transparent; min-height: 28px;
}
.cal-day:hover { background: var(--surface-2); border-color: var(--line); }
.cal-day.has-data { color: var(--ink); font-weight: 700; }
.cal-day.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
.cal-day.dimmed { opacity: 0.3; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day.empty { cursor: default; }
.cal-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 1px 0; font-size: 0.65rem; color: var(--muted); }
.cal-clear { border: 0; background: none; color: var(--danger); font-size: 0.65rem; font-weight: 700; cursor: pointer; }
.cal-clear:hover { text-decoration: underline; }
.status-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.status-card {
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: 0 4px 14px rgba(23,33,29,0.04); text-align: center;
}
.status-card .label { color: var(--muted); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
.status-card .value { font-size: 1.6rem; font-weight: 900; color: var(--brand); line-height: 1.2; margin-top: 2px; }
.status-card.today .value { color: #1a4b8c; }
.status-card.week .value { color: #0f5c4d; }
.status-card.month .value { color: #d86f45; }
.status-card.total .value { color: var(--ink); }
.status-card.nw .value { color: #e65100; }
.status-card.ok .value { color: #2e7d32; }
.charts-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 20px; }
.chart-card {
  padding: 18px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: 0 4px 20px rgba(23,33,29,0.05);
}
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { margin: 0 0 14px; font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
.chart-card .chart-wrap { position: relative; width: 100%; height: 300px; }
.chart-card .chart-wrap canvas { width: 100% !important; height: 100% !important; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty-state strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 8px; }
.loading-bar {
  width: 100%; height: 3px; background: var(--surface-2);
  border-radius: 2px; overflow: hidden; margin-bottom: 0;
}
.loading-bar::after {
  content: ''; display: block; width: 40%; height: 100%;
  background: var(--brand); border-radius: 2px;
  animation: loading 1.2s ease-in-out infinite;
}
@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}
.no-data-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 0.85rem; font-weight: 600; pointer-events: none;
}
.auto-refresh-hint { font-size: 0.65rem; color: var(--muted); text-align: right; padding: 4px 0 0; }
.race-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.race-header h3 { margin: 0; }
.race-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.race-controls label { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.race-controls input[type="date"] {
  height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); font-size: 0.75rem;
}
.race-btn {
  height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); font-size: 0.78rem; font-weight: 700; cursor: pointer;
}
.race-btn:hover { background: var(--surface-2); }
.race-play-btn { background: #107C41 !important; color: #fff !important; border-color: #107C41 !important; }
.race-play-btn:hover:not(:disabled) { background: #0d6937 !important; }
.race-btn:disabled { opacity: 0.4; cursor: default; }
.race-date { font-size: 0.9rem; font-weight: 800; color: var(--brand); text-align: center; padding: 6px 0 0; }
.race-card .chart-wrap { height: 350px; }
.race-canvas { width: 100% !important; height: 100% !important; }
.race-card .product-toggle-btn { background: #107C41; color: #fff; border-color: #107C41; }
.race-card .product-toggle-btn:hover { background: #0d6937; }
.race-card .product-toggle-btn.active { background: var(--brand) !important; color: #fff; border-color: var(--brand) !important; }
@media (max-width: 720px) {
  body { padding: 12px 12px 32px; }
  .charts-grid { grid-template-columns: 1fr; }
  .status-cards { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .status-card { padding: 10px 12px; }
  .status-card .value { font-size: 1.2rem; }
  .brand-lockup h1 { font-size: 1.2rem; }
  .brand-logo { width: 40px; height: 40px; }
  .filter-scroll { flex-wrap: wrap; }
  .chart-card .chart-wrap { height: 250px; }
  .race-card .chart-wrap { height: 280px; }
  .day-calendar { width: 220px; }
  .race-header { flex-direction: column; align-items: flex-start; }
  .race-controls { gap: 6px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-lockup">
      <img class="brand-logo" src="image/logo.JPG" alt="LATTE LAB" />
      <h1>LATTE LAB</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="back-btn" id="refreshDashBtn" style="cursor:pointer;">Refresh</button>
      <a class="back-btn" href="index.html">Back to Orders</a>
    </div>
  </header>
  <div class="filter-bar">
    <div class="filter-scroll">
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="dayToggle">Day ▾</button>
      <div id="dayCalendar" class="day-calendar cal-drop" style="display:none;">
        <div class="cal-header">
          <button type="button" class="cal-arrow" id="calPrev">◀</button>
          <span class="cal-month" id="calMonthLabel"></span>
          <button type="button" class="cal-arrow" id="calNext">▶</button>
        </div>
        <div class="cal-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-footer"><span id="calCount">0 selected</span> · <button type="button" class="cal-clear" id="calClear">Clear</button></div>
      </div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="weekToggle">Week ▾</button>
      <div id="weekCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="monthToggle">Month ▾</button>
      <div id="monthCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <div class="filter-dropdown">
      <button class="product-toggle-btn" id="productToggle">Product ▾</button>
      <div id="productCheckboxes" class="period-checkboxes product-menu"></div>
    </div>
    <button class="product-toggle-btn clear-filter-btn" id="clearFilterBtn">Clear</button>
    </div>
  </div>
  <div class="status-cards" id="statusCards"></div>
  <div class="loading-bar" id="loadingBar" style="display:none;"></div>
  <div class="charts-grid">
    <div class="chart-card full"><h3>Orders</h3><div class="chart-wrap"><canvas id="ordersChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products</h3><div class="chart-wrap"><canvas id="topProductsChart"></canvas></div></div>
    <div class="chart-card full"><h3>Top 5 Products · Daily Trend</h3><div class="chart-wrap"><canvas id="productTrendChart"></canvas></div></div>
    <div class="chart-card full race-card">
      <div class="race-header">
        <h3>Product Race</h3>
        <div class="race-controls">
          <div class="filter-dropdown">
            <button class="product-toggle-btn" id="raceProdToggle">Products ▾</button>
            <div id="raceProdCheckboxes" class="period-checkboxes product-menu"></div>
          </div>
          <label>Start <input type="date" id="raceStartDate"></label>
          <button id="racePlay" class="race-btn race-play-btn">▶ Play</button>
          <button id="racePause" class="race-btn" disabled><span style="color:#FFBA01;">❚❚</span> Pause</button>
          <button id="raceStop" class="race-btn" disabled><span style="color:#b33939;">■</span> Stop</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="raceChart" class="race-canvas"></canvas></div>
      <div class="race-date" id="raceDateLabel"></div>
    </div>
  </div>
  <div class="auto-refresh-hint" id="refreshHint"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="config.js"></script><script>
(function() {
  "use strict";
  var CFG = window.LATTE_LAB_CONFIG || {};
  var supabase = null;
  var charts = {};
  var allItems = [];
  var weekSelected = new Set();
  var monthSelected = new Set();
  var calSelected = new Set();
  var activeProductValues = new Set();
  var calMonth, calYear;

  function pad(n) { return String(n).padStart(2,'0'); }
  function dparse(s) { if(!s) return null; var d=new Date(s); return isNaN(d.getTime())?null:d; }
  function dayKey(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function weekKey(d) {
    var dn=(d.getDay()+6)%7;
    var mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dn);
    var t=new Date(d.valueOf());
    t.setDate(t.getDate()-dn+3);
    var ft=new Date(t.getFullYear(),0,4);
    var wk=Math.round((t.getTime()-ft.getTime())/604800000)+1;
    return mon.getFullYear()+'-W'+pad(wk);
  }
  function monthKey(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1); }

  function matchPeriod(r) {
    var d=dparse(r.created_at); if(!d) return false;
    if(calSelected.size>0 && !calSelected.has(dayKey(d))) return false;
    if(weekSelected.size>0 && !weekSelected.has(weekKey(d))) return false;
    if(monthSelected.size>0 && !monthSelected.has(monthKey(d))) return false;
    return true;
  }

  function getFilteredItems() {
    return allItems.filter(function(r){
      if(activeProductValues.size>0&&!activeProductValues.has(r.name)) return false;
      return matchPeriod(r);
    });
  }

  function populateCheckboxes(elId, selSet, calcKey) {
    var box=document.getElementById(elId);
    var keys={};
    for(var i=0;i<allItems.length;i++){
      var d=dparse(allItems[i].created_at); if(!d) continue;
      var k=calcKey(d);
      keys[k]=true;
    }
    var sorted=Object.keys(keys).sort().reverse();
    var allChecked=sorted.every(function(v){return selSet.has(v);});
    var h='<label class="select-all"><input type="checkbox" class="cb-sa"'+ (allChecked&&sorted.length>0?' checked':'') +'> Select All</label>';
    h+='<hr class="menu-sep">';
    for(var j=0;j<sorted.length;j++){
      var v=sorted[j], lbl;
      if(calcKey===weekKey) lbl=v.replace('-W',' W');
      else lbl=v;
      var ck=selSet.has(v)?' checked':'';
      h+='<label><input type="checkbox" class="cb-item" value="'+v+'"'+ck+'> '+lbl+'</label>';
    }
    box.innerHTML=h;
  }

  function syncCheckboxSet(elId, selSet) {
    selSet.clear();
    var cbs=document.querySelectorAll('#'+elId+' input.cb-item');
    for(var i=0;i<cbs.length;i++){if(cbs[i].checked) selSet.add(cbs[i].value);}
  }

  function clearAllFilters() {
    calSelected.clear(); weekSelected.clear(); monthSelected.clear();
    activeProductValues.clear();
    var cal=document.getElementById('dayCalendar');
    cal.style.display='none'; document.getElementById('dayToggle').classList.remove('active');
    document.getElementById('weekCheckboxes').classList.remove('show'); document.getElementById('weekToggle').classList.remove('active');
    document.getElementById('monthCheckboxes').classList.remove('show'); document.getElementById('monthToggle').classList.remove('active');
    var pCbs=document.querySelectorAll('#productCheckboxes input.product-cb');
    for(var i=0;i<pCbs.length;i++) pCbs[i].checked=false;
    var pSa=document.querySelector('#productCheckboxes input.select-all-cb');
    if(pSa) pSa.checked=false;
    activeProductValues.clear();
    refreshAll();
  }

  function renderCards() {
    var now=new Date();
    var tk=dayKey(now), wkK=weekKey(now), mk=monthKey(now);
    var td=0, wk=0, mo=0;
    for(var i=0;i<allItems.length;i++){
      var d=dparse(allItems[i].created_at); if(!d) continue;
      var q=Number(allItems[i].quantity)||0;
      if(dayKey(d)===tk) td+=q;
      if(weekKey(d)===wkK) wk+=q;
      if(monthKey(d)===mk) mo+=q;
    }
    var items=getFilteredItems();
    var total=0, nw=0, ok=0;
    for(var i=0;i<items.length;i++){
      var q=Number(items[i].quantity)||0;
      total+=q;
      if(items[i].status==='new') nw+=q;
      else if(items[i].status==='completed') ok+=q;
    }
    var html='';
    var cards=[
      {l:'Today',v:td,c:'today'},{l:'This Week',v:wk,c:'week'},{l:'This Month',v:mo,c:'month'},
      {l:'Total',v:total,c:'total'},{l:'New',v:nw,c:'nw'},{l:'Completed',v:ok,c:'ok'}
    ];
    for(var i=0;i<cards.length;i++){
      html+='<div class="status-card '+cards[i].c+'"><div class="label">'+cards[i].l+'</div><div class="value">'+cards[i].v+'</div></div>';
    }
    document.getElementById('statusCards').innerHTML=html;
  }

  function populateProducts() {
    var names={}, prev=[];
    var existing=document.querySelectorAll('#productCheckboxes input.product-cb');
    for(var i=0;i<existing.length;i++){if(existing[i].checked) prev.push(existing[i].value);}
    for(var i=0;i<allItems.length;i++) names[allItems[i].name]=true;
    var ks=Object.keys(names).sort();
    var allChecked=prev.length===ks.length;
    var h='<label class="select-all"><input type="checkbox" class="select-all-cb"'+ (allChecked&&ks.length>0?' checked':'') +'> Select All</label><hr class="menu-sep">';
    for(var j=0;j<ks.length;j++){
      var ck=prev.indexOf(ks[j])>=0?' checked':'';
      h+='<label><input type="checkbox" class="product-cb" value="'+ks[j]+'"'+ck+'> '+ks[j]+'</label>';
    }
    document.getElementById('productCheckboxes').innerHTML=h;
    readProductChecked();
  }

  function readProductChecked() {
    activeProductValues.clear();
    var cbs=document.querySelectorAll('#productCheckboxes input.product-cb');
    for(var i=0;i<cbs.length;i++){if(cbs[i].checked) activeProductValues.add(cbs[i].value);}
  }

  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getDataDays() {
    var set=new Set();
    for(var i=0;i<allItems.length;i++){
      var d=dparse(allItems[i].created_at); if(!d) continue;
      set.add(dayKey(d));
    }
    return set;
  }

  function renderCalendar() {
    var dataDays=getDataDays();
    var todayStr=dayKey(new Date());
    var hasOtherFilter=weekSelected.size>0||monthSelected.size>0;
    var label=document.getElementById('calMonthLabel');
    label.textContent=MONTHS[calMonth]+' '+calYear;
    var grid=document.getElementById('calGrid');
    var first=new Date(calYear,calMonth,1);
    var startDow=(first.getDay()+6)%7;
    var lastDate=new Date(calYear,calMonth+1,0).getDate();
    var h='';
    for(var i=0;i<startDow;i++) h+='<span class="cal-day empty"></span>';
    for(var day=1;day<=lastDate;day++){
      var d=new Date(calYear,calMonth,day);
      var key=dayKey(d);
      var cls=['cal-day'];
      if(dataDays.has(key)) cls.push('has-data');
      if(calSelected.has(key)) cls.push('selected');
      if(key===todayStr) cls.push('today');
      if(hasOtherFilter){
        var ok=true;
        if(weekSelected.size>0&&!weekSelected.has(weekKey(d))) ok=false;
        if(monthSelected.size>0&&!monthSelected.has(monthKey(d))) ok=false;
        if(!ok) cls.push('dimmed');
      }
      h+='<span class="'+cls.join(' ')+'" data-date="'+key+'">'+day+'</span>';
    }
    grid.innerHTML=h;
    var calCount=document.getElementById('calCount');
    var total=weekSelected.size+monthSelected.size+calSelected.size;
    calCount.textContent=calSelected.size+' selected'+(total>calSelected.size?' (filtered)':'');
  }

  function toggleCalDate(dateKey) {
    if(calSelected.has(dateKey)) calSelected.delete(dateKey);
    else calSelected.add(dateKey);
    renderCalendar();
    refreshAll();
  }

  function barLabelPlugin() {
    return {
      id:'barLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, ds=chart.data.datasets[0];
        if(!ds) return;
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data) return;
        for(var i=0;i<meta.data.length;i++){
          var b=meta.data[i], v=ds.data[i];
          if(!v) continue;
          ctx.fillStyle='#17211d'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='center';
          ctx.fillText(v, b.x, b.y-8);
        }
      }
    };
  }

  function hBarLabelPlugin() {
    return {
      id:'hBarLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, ds=chart.data.datasets[0];
        if(!ds) return;
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data) return;
        for(var i=0;i<meta.data.length;i++){
          var b=meta.data[i], v=ds.data[i];
          if(!v) continue;
          ctx.fillStyle='#17211d'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='left';
          ctx.fillText(v, b.x+8, b.y+5);
        }
      }
    };
  }

  function lineLabelPlugin() {
    return {
      id:'lineLabel',
      afterDraw:function(chart){
        var ctx=chart.ctx, meta0=chart.getDatasetMeta(0);
        if(!meta0||!meta0.data||!meta0.data.length) return;
        var last=meta0.data.length-1;
        for(var i=0;i<chart.data.datasets.length;i++){
          var ds=chart.data.datasets[i], meta=chart.getDatasetMeta(i);
          if(!meta||!meta.data||!meta.data[last]) continue;
          var pt=meta.data[last], v=ds.data[last];
          if(!v) continue;
          ctx.fillStyle=ds.borderColor||'#333'; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='left';
          ctx.fillText(ds.label+' '+v, pt.x+6, pt.y);
        }
      }
    };
  }

  function legendMultiSelect(e, legendItem, legend) {
    if(!legendItem) return;
    var chart=legend.chart;
    var vis=[];
    for(var i=0;i<chart.data.datasets.length;i++){
      var meta=chart.getDatasetMeta(i);
      vis.push(!meta.hidden);
    }
    var allVisible=vis.every(function(v){return v;});
    var idx=legendItem.datasetIndex!==undefined?legendItem.datasetIndex:legendItem.index;
    if(allVisible){
      for(var i=0;i<chart.data.datasets.length;i++) chart.setDatasetVisibility(i, i===idx);
    }else{
      var meta=chart.getDatasetMeta(idx);
      chart.setDatasetVisibility(idx, !!meta.hidden);
      var anyVisible=false;
      for(var i=0;i<chart.data.datasets.length;i++){if(chart.getDatasetMeta(i).visible!==false) anyVisible=true;}
      if(!anyVisible){
        for(var i=0;i<chart.data.datasets.length;i++) chart.setDatasetVisibility(i, true);
      }
    }
    chart.update();
  }

  var raceData=[], raceIndex=0, raceTimer=null, racePlaying=false, raceSelectedProducts=new Set();

  function buildRaceData() {
    var startStr=document.getElementById('raceStartDate').value;
    var startD=startStr?dparse(startStr+'T00:00:00'):null;
    var endD=new Date(); // today
    endD.setHours(23,59,59,999);
    // build all days from start to today
    var allDays=[];
    if(startD){
      var cursor=new Date(startD.getTime());
      while(cursor<=endD){
        allDays.push(dayKey(cursor));
        cursor.setDate(cursor.getDate()+1);
      }
    }
    // group data by day + product
    var daily={};
    var prodSet=new Set();
    for(var i=0;i<allItems.length;i++){
      var r=allItems[i], d=dparse(r.created_at); if(!d) continue;
      if(raceSelectedProducts.size>0&&!raceSelectedProducts.has(r.name)) continue;
      if(startD&&d<startD) continue;
      if(d>endD) continue;
      var dk=dayKey(d);
      if(!daily[dk]) daily[dk]={};
      daily[dk][r.name]=(daily[dk][r.name]||0)+(Number(r.quantity)||0);
      prodSet.add(r.name);
    }
    // if no start date, use days with data
    if(!allDays.length){
      allDays=Object.keys(daily).sort();
    }
    var acc={};
    var result=[];
    for(var di=0;di<allDays.length;di++){
      var dk=allDays[di];
      if(daily[dk]){
        for(var n in daily[dk]) acc[n]=(acc[n]||0)+daily[dk][n];
      }
      var leaders=Object.keys(acc).filter(function(p){return acc[p];}).map(function(p){
        return {name:p,value:acc[p]};
      }).sort(function(a,b){return b.value-a.value;});
      result.push({date:dk,leaders:leaders});
    }
    raceData=result;
  }

  function initRaceChart() {
    // custom canvas – set size from container
    var wrap=document.getElementById('raceChart').parentNode;
    var canvas=document.getElementById('raceChart');
    canvas.style.width='100%'; canvas.style.height='100%';
    canvas.width=wrap.clientWidth; canvas.height=wrap.clientHeight;
    raceCanvas=canvas; raceCtx=canvas.getContext('2d');
    installRaceResize();
  }

  var raceBars=[]; // [{name,value,color,y,targetY,w,targetW,alpha}, ...]
  var raceCanvas, raceCtx;
  var raceAnimId=null;
  var raceResizeObs=null;

  function installRaceResize() {
    if(raceResizeObs) raceResizeObs.disconnect();
    var wrap=document.getElementById('raceChart').parentNode;
    raceResizeObs=new ResizeObserver(function(){
      var c=document.getElementById('raceChart');
      if(c.width!==wrap.clientWidth||c.height!==wrap.clientHeight){
        c.width=wrap.clientWidth; c.height=wrap.clientHeight;
        raceCanvas=c; raceCtx=c.getContext('2d');
        if(raceBars.length) drawRaceBars();
      }
    });
    raceResizeObs.observe(wrap);
  }

  function ensureRaceCtx(){
    if(!raceCtx){
      raceCanvas=document.getElementById('raceChart');
      raceCtx=raceCanvas.getContext('2d');
    }
  }

  function drawRaceBars(){
    ensureRaceCtx();
    var W=raceCanvas.width, H=raceCanvas.height;
    if(!W||!H) return;
    raceCtx.clearRect(0,0,W,H);
    // sort by current y to keep visual order correct
    var sorted=raceBars.slice().sort(function(a,b){return a.y-b.y;});
    var n=8;
    var gap=4;
    var barH=(H-gap*(n-1))/n;
    var step=barH+gap;
    var rankW=26;
    var maxW=0;
    for(var i=0;i<sorted.length;i++){if(sorted[i].targetW>maxW) maxW=sorted[i].targetW;}
    if(!maxW) maxW=1;
    var labelW=110;
    var scale=(W-labelW-10)/maxW;
    for(var i=0;i<sorted.length;i++){
      var b=sorted[i];
      var bw=b.w*scale;
      var y=b.y;
      raceCtx.globalAlpha=b.alpha||1;
      // Y-axis product name with wrapping
       raceCtx.fillStyle='#17211d';
       raceCtx.font='11px Inter, sans-serif';
       raceCtx.textAlign='right'; raceCtx.textBaseline='middle';
       var words=b.name.split(' ');
       var line1='', line2='';
       for(var wi=0;wi<words.length;wi++){
         var test=line1?(line1+' '+words[wi]):words[wi];
         if(raceCtx.measureText(test).width<labelW-8||!line1) line1=test;
         else line2=line2?(line2+' '+words[wi]):words[wi];
       }
       if(line2){
         raceCtx.fillText(line1,labelW-4,y+barH/2-6);
         raceCtx.fillText(line2,labelW-4,y+barH/2+6);
       }else{
         raceCtx.fillText(line1,labelW-4,y+barH/2);
       }
       var x=labelW+6;
      var c=b.color;
      // 3D gradient bar
      var grad=raceCtx.createLinearGradient(x,0,x+bw,0);
      grad.addColorStop(0,c+'dd'); grad.addColorStop(0.7,c+'cc'); grad.addColorStop(1,c+'88');
      raceCtx.fillStyle=grad;
      roundRect(raceCtx,x,y,bw,barH,4);
      raceCtx.fill();
      // top highlight
      var hgrad=raceCtx.createLinearGradient(x,y,x,y+barH*0.4);
      hgrad.addColorStop(0,'rgba(255,255,255,0.25)'); hgrad.addColorStop(1,'rgba(255,255,255,0)');
      raceCtx.fillStyle=hgrad;
      roundRect(raceCtx,x,y,bw,barH,4);
      raceCtx.fill();
      // value
      raceCtx.fillStyle='#fff';
      raceCtx.font='bold 11px Inter,sans-serif';
      raceCtx.textAlign='right'; raceCtx.textBaseline='middle';
      raceCtx.fillText(Math.round(b.value),x+bw-8,y+barH/2);
    }
    raceCtx.globalAlpha=1;
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function getProductColor(name){
    var h=0;
    for(var i=0;i<name.length;i++) h=((h<<5)-h)+name.charCodeAt(i);
    return RACE_COLORS[Math.abs(h)%RACE_COLORS.length];
  }

  function syncRaceBars(target,prevMap){
    ensureRaceCtx();
    var H=raceCanvas.height||350;
    var gap=4, n=8;
    var barH=(H-gap*(n-1))/n;
    var step=barH+gap;
    var newBars=[];
    for(var i=0;i<target.length;i++){
      var t=target[i];
      var prev=prevMap?prevMap.get(t.name):null;
      newBars.push({
        name:t.name,
        value:t.value,
        color:RACE_COLORS[i%RACE_COLORS.length],
        y:prev?prev.y:i*step,
        targetY:i*step,
        w:prev?prev.w:0,
        targetW:t.value,
        alpha:1
      });
    }
    if(prevMap){
      var keep=new Set(target.map(function(t){return t.name;}));
      prevMap.forEach(function(p,name){
        if(!keep.has(name)){
          newBars.push({
            name:name, value:p.value||0, color:p.color||'#999',
            y:p.y, targetY:H+20, w:p.w||0, targetW:0, alpha:0
          });
        }
      });
    }
    raceBars=newBars;
  }

  function animateRaceBars(){
    var done=true;
    var H=raceCanvas.height||350;
    var gap=4, n=8, barH=(H-gap*(n-1))/n, step=barH+gap;
    for(var i=0;i<raceBars.length;i++){
      var b=raceBars[i];
      b.y+=0.08*(b.targetY-b.y);
      b.w +=0.08*(b.targetW-b.w);
      if(b.targetY>H) b.alpha-=(1-b.alpha)*0.3+0.05;
    }
    // sort by targetY and assign distinct positions
    raceBars.sort(function(a,b){return a.targetY-b.targetY;});
    for(var i=0;i<raceBars.length;i++){
      var targetY=i<8?i*step:H+step;
      raceBars[i].targetY=targetY;
      // soft nudge only if extremely close
      if(i>0){
        var minY=raceBars[i-1].y+2;
        if(raceBars[i].y<minY) raceBars[i].y+=(minY-raceBars[i].y)*0.5;
      }
      if(raceBars[i].targetY>H) raceBars[i].alpha-=(1-raceBars[i].alpha)*0.3+0.05;
      if(Math.abs(targetY-raceBars[i].y)>0.5||Math.abs(raceBars[i].targetW-raceBars[i].w)>0.5||(targetY>H&&raceBars[i].alpha>0.01)){
        done=false;
      }
    }
    raceBars=raceBars.filter(function(b){return !(b.targetY>H&&b.alpha<0.02);});
    drawRaceBars();
    if(!done) raceAnimId=requestAnimationFrame(animateRaceBars);
    else raceAnimId=null;
  }

  function applyRaceFrame(target) {
    var prevMap=null;
    if(raceBars.length){
      prevMap=new Map();
      for(var i=0;i<raceBars.length;i++){
        prevMap.set(raceBars[i].name,{y:raceBars[i].y,w:raceBars[i].w,value:raceBars[i].value,color:raceBars[i].color});
      }
    }
    syncRaceBars(target,prevMap);
    if(raceAnimId) cancelAnimationFrame(raceAnimId);
    animateRaceBars();
  }

  function raceStep() {
    if(!racePlaying) return;
    var frame=raceData[raceIndex];
    applyRaceFrame(frame.leaders.slice(0,8));
    document.getElementById('raceDateLabel').textContent=frame.date;
    raceIndex++;
    if(raceIndex>=raceData.length){racePause();return;}
    raceTimer=setTimeout(raceStep,900);
  }

  function racePlay() {
    buildRaceData();
    if(!raceData.length) return;
    if(raceTimer) clearTimeout(raceTimer);
    if(raceAnimId) cancelAnimationFrame(raceAnimId);
    raceBars=[];
    raceIndex=0;
    racePlaying=true;
    document.getElementById('racePlay').disabled=true;
    document.getElementById('racePause').disabled=false;
    document.getElementById('raceStop').disabled=false;
    initRaceChart();
    raceStep();
  }

  function racePause() {
    racePlaying=false;
    if(raceTimer) clearTimeout(raceTimer);
    // snap bars to target
    if(raceBars.length){
      for(var i=0;i<raceBars.length;i++){
        raceBars[i].y=raceBars[i].targetY;
        raceBars[i].w=raceBars[i].targetW;
      }
      drawRaceBars();
    }
    if(raceAnimId){cancelAnimationFrame(raceAnimId);raceAnimId=null;}
    document.getElementById('racePlay').disabled=false;
    document.getElementById('racePause').disabled=true;
  }

  function raceStop() {
    racePlaying=false;
    if(raceTimer) clearTimeout(raceTimer);
    if(raceAnimId) cancelAnimationFrame(raceAnimId);
    raceBars=[];
    raceIndex=0;
    raceCtx=null;
    document.getElementById('racePlay').disabled=false;
    document.getElementById('racePause').disabled=true;
    document.getElementById('raceStop').disabled=true;
    if(raceData.length){
      initRaceChart();
      raceBars=[];
      applyRaceFrame(raceData[0].leaders.slice(0,8));
      document.getElementById('raceDateLabel').textContent=raceData[0].date;
    } else {document.getElementById('raceDateLabel').textContent='';ensureRaceCtx();raceCtx.clearRect(0,0,raceCanvas.width,raceCanvas.height);}
  }

  function populateRaceProducts() {
    var names={};
    for(var i=0;i<allItems.length;i++) names[allItems[i].name]=true;

  async function fetchData() {
    if(!supabase){
      document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
      return;
    }
    showLoading();
    try{
      var res=await supabase.from('order_items').select('*').order('created_at',{ascending:false});
      if(res.error) throw res.error;
      allItems=res.data||[];
      lastRefresh=new Date();
      populateProducts();
      populateRaceProducts();
      if(!document.getElementById('raceStartDate').value){
        document.getElementById('raceStartDate').value=dayKey(new Date());
      }
      refreshAll();
    }catch(e){
      console.error(e);
      document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Failed to load</strong><span>'+(e.message||e.code||'Error')+'</span></div>';
    }
    hideLoading();
    updateRefreshHint();
  }

  function initSupabase(){
    var u=CFG.supabaseUrl||'', k=CFG.supabaseAnonKey||'';
    if(!u||!k||!window.supabase) return false;
    try{supabase=window.supabase.createClient(u,k);return true;}catch(e){console.error(e);return false;}
  }

  function startAutoRefresh() {
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer=setInterval(function(){fetchData();},60000);
    setInterval(function(){updateRefreshHint();},15000);
  }

  function closeAllDropdowns(except) {
    var menus=document.querySelectorAll('.product-menu.show, .cal-drop[style*="block"]');
    for(var i=0;i<menus.length;i++){
      if(except&&menus[i]===except) continue;
      menus[i].classList.remove('show');
      menus[i].style.display='none';
    }
    var btns=document.querySelectorAll('.product-toggle-btn.active');
    for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  }

  document.getElementById('dayToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var cal=document.getElementById('dayCalendar');
    var open=cal.style.display===''; cal.style.display=open?'none':'';
    this.classList.toggle('active',!open);
    if(!open){
      closeAllDropdowns(cal);
      if(!calYear){var now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();}
      renderCalendar();
    }
  });

  document.getElementById('weekToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var menu=document.getElementById('weekCheckboxes');
    var open=menu.classList.toggle('show');
    this.classList.toggle('active',open);
    if(open){closeAllDropdowns(menu);populateCheckboxes('weekCheckboxes',weekSelected,weekKey);}
  });

  document.getElementById('monthToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var menu=document.getElementById('monthCheckboxes');
    var open=menu.classList.toggle('show');
    this.classList.toggle('active',open);
    if(open){closeAllDropdowns(menu);populateCheckboxes('monthCheckboxes',monthSelected,monthKey);}
  });

  document.getElementById('weekCheckboxes').addEventListener('change',function(e){
    if(e.target.classList.contains('cb-sa')){
      var cbs=document.querySelectorAll('#weekCheckboxes input.cb-item');
      for(var i=0;i<cbs.length;i++) cbs[i].checked=e.target.checked;
    }
    if(e.target.type==='checkbox'){syncCheckboxSet('weekCheckboxes',weekSelected);refreshAll();}
  });

  document.getElementById('monthCheckboxes').addEventListener('change',function(e){
    if(e.target.classList.contains('cb-sa')){
      var cbs=document.querySelectorAll('#monthCheckboxes input.cb-item');
      for(var i=0;i<cbs.length;i++) cbs[i].checked=e.target.checked;
    }
    if(e.target.type==='checkbox'){syncCheckboxSet('monthCheckboxes',monthSelected);refreshAll();}
  });

  document.getElementById('calGrid').addEventListener('click',function(e){
    var day=e.target.closest('.cal-day');
    if(!day||day.classList.contains('empty')) return;
    toggleCalDate(day.dataset.date);
  });
  document.getElementById('calPrev').addEventListener('click',function(e){
    e.stopPropagation();
    if(calMonth===0){calMonth=11;calYear--;}else calMonth--;
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click',function(e){
    e.stopPropagation();
    if(calMonth===11){calMonth=0;calYear++;}else calMonth++;
    renderCalendar();
  });
  document.getElementById('calClear').addEventListener('click',function(e){
    e.stopPropagation();
    calSelected.clear(); renderCalendar(); refreshAll();
  });

  document.getElementById('productToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var menu=document.getElementById('productCheckboxes');
    var open=menu.classList.toggle('show');
    this.classList.toggle('active',open);
  });

  document.getElementById('productCheckboxes').addEventListener('change',function(e){
    if(e.target.classList.contains('select-all-cb')){
      var checked=e.target.checked;
      var cbs=document.querySelectorAll('#productCheckboxes input.product-cb');
      for(var i=0;i<cbs.length;i++) cbs[i].checked=checked;
    }
    if(e.target.type==='checkbox'){readProductChecked();refreshAll();}
  });

  document.getElementById('clearFilterBtn').addEventListener('click',function(e){
    e.stopPropagation(); clearAllFilters();
  });

  document.getElementById('raceProdToggle').addEventListener('click',function(e){
    e.stopPropagation();
    var menu=document.getElementById('raceProdCheckboxes');
    var open=menu.classList.toggle('show');
    this.classList.toggle('active',open);
  });

  document.getElementById('raceProdCheckboxes').addEventListener('change',function(e){
    if(e.target.classList.contains('cb-sa')){
      var checked=e.target.checked;
      var cbs=document.querySelectorAll('#raceProdCheckboxes input.cb-item');
      for(var i=0;i<cbs.length;i++) cbs[i].checked=checked;
    }
    if(e.target.type==='checkbox') syncRaceProducts();
  });

  document.getElementById('racePlay').addEventListener('click',function(e){e.stopPropagation();racePlay();});
  document.getElementById('racePause').addEventListener('click',function(e){e.stopPropagation();racePause();});
  document.getElementById('raceStop').addEventListener('click',function(e){e.stopPropagation();raceStop();});

  document.addEventListener('click',function(e){
    var inDropdown=e.target.closest('.filter-dropdown');
    if(!inDropdown){
      var menus=document.querySelectorAll('.product-menu.show');
      for(var i=0;i<menus.length;i++) menus[i].classList.remove('show');
      var cal=document.getElementById('dayCalendar');
      if(cal) cal.style.display='none';
      var btns=document.querySelectorAll('.product-toggle-btn.active');
      for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
    }
  });

  document.getElementById('refreshDashBtn').addEventListener('click',function(){fetchData();});
  if(initSupabase()){fetchData();startAutoRefresh();}
  else document.getElementById('statusCards').innerHTML='<div class="empty-state" style="grid-column:1/-1"><strong>Supabase not configured</strong><span>Check config.js</span></div>';
})();
</script>
</body>
</html>
