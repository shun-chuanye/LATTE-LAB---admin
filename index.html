<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LATTE LAB · Admin</title>
    <link rel="icon" href="image/logo.JPG" />
    <style>
      :root {
        --bg: #f7f8f4;
        --surface: #ffffff;
        --surface-2: #edf5f0;
        --ink: #17211d;
        --muted: #66746c;
        --line: #dce5dd;
        --brand: #0f5c4d;
        --accent: #d86f45;
        --danger: #b33939;
        --radius: 8px;
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--bg); }

      body {
        min-height: 100%; margin: 0;
        background: linear-gradient(180deg, rgba(15,92,77,0.06), transparent 360px), var(--bg);
        color: var(--ink); padding: 18px 18px 48px;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }

      .app-shell { width: min(1280px, 100%); margin: 0 auto; }

      /* header */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 8px 0 18px; flex-wrap: wrap;
      }
      .brand-lockup { display: flex; align-items: center; gap: 12px; }
      .brand-logo {
        width: 50px; height: 50px; border-radius: var(--radius);
        object-fit: cover; border: 1px solid rgba(23,33,29,0.12); background: var(--surface);
      }
      .brand-lockup h1 { margin: 0; font-size: 1.5rem; line-height: 1; }
      .brand-lockup .eyebrow {
        margin: 0 0 2px; color: var(--accent); font-size: 0.7rem;
        font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
      }
      .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 42px; height: 42px; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); color: var(--brand);
        box-shadow: 0 4px 14px rgba(23,33,29,0.06);
      }
      .icon-btn:hover { background: var(--surface-2); }
      .icon-btn svg { width: 18px; height: 18px; }

      /* stats */
      .stats-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px; margin-bottom: 20px;
      }
      .stat-card {
        padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); box-shadow: 0 4px 14px rgba(23,33,29,0.04);
      }
      .stat-card .label {
        color: var(--muted); font-size: 0.72rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.04em;
      }
      .stat-card .value { font-size: 1.5rem; font-weight: 900; line-height: 1.2; margin-top: 2px; color: var(--brand); }

      /* filters */
      .filters {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        margin-bottom: 18px; padding: 12px 14px; border: 1px solid var(--line);
        border-radius: var(--radius); background: var(--surface);
      }
      .filters label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
      .filters select, .filters input[type="text"] {
        height: 34px; padding: 0 10px; border: 1px solid var(--line);
        border-radius: var(--radius); background: var(--bg); color: var(--ink);
        font-weight: 500; min-width: 100px;
      }
      .filters input[type="text"] { min-width: 160px; }
      .filters .spacer { flex: 1; min-width: 20px; }

      /* status badge */
      .badge-status {
        display: inline-block; padding: 2px 10px; border-radius: 999px;
        font-size: 0.7rem; font-weight: 800; text-transform: capitalize;
        letter-spacing: 0.02em; background: var(--surface-2); color: var(--muted);
      }
      .badge-status.new { background: #e6f0ff; color: #1a4b8c; }
      .badge-status.accepted { background: #e6f7e6; color: #1a7a3a; }
      .badge-status.preparing { background: #fff3e0; color: #a8641a; }
      .badge-status.ready { background: #e8f5e9; color: #2e7d32; }
      .badge-status.completed { background: #e0e0e0; color: #424242; }
      .badge-status.cancelled { background: #fde0e0; color: #b33939; }

      /* table */
      .table-wrap {
        border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); overflow: hidden;
        box-shadow: 0 4px 20px rgba(23,33,29,0.05);
      }
      .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
      thead { background: var(--surface-2); border-bottom: 1px solid var(--line); }
      th {
        padding: 12px 14px; text-align: left; font-size: 0.72rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap;
      }
      td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tr:last-child td { border-bottom: 0; }
      tr:hover td { background: #fafbf9; }

      .order-id { font-weight: 700; font-size: 0.8rem; color: var(--brand); word-break: break-all; }
      .order-customer { font-weight: 600; }
      .order-customer .sub { display: block; font-weight: 400; font-size: 0.75rem; color: var(--muted); }
      .order-amount { font-weight: 700; white-space: nowrap; }
      .order-amount .khr { font-weight: 400; font-size: 0.75rem; color: var(--muted); display: block; }
      .order-time { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
      .order-items { font-size: 0.8rem; min-width: 140px; line-height: 1.5; white-space: nowrap; }

      .complete-btn {
        padding: 4px 12px; border: 0; border-radius: var(--radius);
        background: var(--brand); color: #fff; font-size: 0.75rem;
        font-weight: 700; white-space: nowrap;
      }
      .complete-btn:hover { opacity: 0.85; }

      .delete-btn {
        padding: 4px 10px; border: 0; border-radius: var(--radius);
        background: var(--danger); color: #fff; font-size: 0.75rem;
        font-weight: 700; white-space: nowrap; margin-top: 6px;
      }
      .delete-btn:hover { opacity: 0.85; }

      .action-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

      .empty-state { padding: 48px 20px; text-align: center; color: var(--muted); }
      .empty-state strong { display: block; color: var(--ink); font-size: 1.05rem; }

      /* responsive */
      @media (max-width: 720px) {
        body { padding: 12px 12px 32px; }
        .topbar { flex-direction: column; align-items: stretch; }
        .stats-grid { grid-template-columns: repeat(2, 1fr); }
        .stat-card .value { font-size: 1.2rem; }
        .filters { flex-direction: column; align-items: stretch; }
        .filters select, .filters input[type="text"] { min-width: 0; width: 100%; }
        .filters .spacer { display: none; }
        table { font-size: 0.8rem; min-width: 600px; }
        th, td { padding: 8px 10px; }
      }

      @media (max-width: 420px) {
        .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card { padding: 10px 12px; }
        .stat-card .value { font-size: 1rem; }
        .brand-lockup h1 { font-size: 1.2rem; }
        .brand-logo { width: 40px; height: 40px; }
      }
    </style>
  </head>
  <body>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="image/logo.JPG" alt="LATTE LAB" />
          <div>
            <p class="eyebrow">Admin · Orders</p>
            <h1>LATTE LAB</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh">
            <i data-lucide="rotate-ccw"></i>
          </button>
          <span style="font-size:0.78rem;color:var(--muted);font-weight:600;" id="orderCount">0 orders</span>
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total</div><div class="value" id="statTotal">—</div></div>
        <div class="stat-card"><div class="label">USD</div><div class="value" id="statUsd">—</div></div>
        <div class="stat-card"><div class="label">KHR</div><div class="value" id="statKhr">—</div></div>
        <div class="stat-card"><div class="label">Pending</div><div class="value" id="statPending">—</div></div>
      </div>

      <div class="filters">
        <label>
          Status
          <select id="statusFilter">
            <option value="">All</option>
            <option value="new">New</option>
            <option value="accepted">Accepted</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label>
          Date
          <input type="text" id="dateFilter" placeholder="M/D  e.g. 7/24" style="min-width:90px;" />
        </label>
        <label>
          Search
          <input type="text" id="searchFilter" placeholder="Customer or order ID" />
        </label>
        <div class="spacer"></div>
        <button type="button" id="clearFiltersBtn" style="height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--muted);font-size:0.78rem;font-weight:700;">Clear</button>
        <span style="font-size:0.75rem;color:var(--muted);font-weight:600;" id="filterResult">—</span>
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Amount</th>
                <th>Items</th>
                <th>Time</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="config.js"></script>

    <script>
      (function() {
        "use strict";

        const CFG = window.LATTE_LAB_CONFIG || {};

        let allOrders = [];
        let supabase = null;

        const $ = (sel) => document.querySelector(sel);

        const body = $('#ordersBody');
        const statTotal = $('#statTotal');
        const statUsd = $('#statUsd');
        const statKhr = $('#statKhr');
        const statPending = $('#statPending');
        const orderCount = $('#orderCount');
        const filterResult = $('#filterResult');
        const statusFilter = $('#statusFilter');
        const searchFilter = $('#searchFilter');
        const dateFilter = $('#dateFilter');
        const clearFiltersBtn = $('#clearFiltersBtn');
        const refreshBtn = $('#refreshBtn');

        function formatDate(iso) {
          if (!iso) return '—';
          try {
            var d = new Date(iso);
            var h = d.getHours();
            var m = String(d.getMinutes()).padStart(2, '0');
            return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + h + ':' + m;
          } catch { return iso; }
        }

        function formatCurrency(amount, currency) {
          if (currency === 'KHR') return new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(amount) + ' KHR';
          return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        function statusBadge(status) {
          return `<span class="badge-status ${status || ''}">${status || 'unknown'}</span>`;
        }

        function truncate(str, len) {
          if (!str) return '—';
          return str.length > len ? str.slice(0, len) + '…' : str;
        }

        function renderOrders(orders) {
          if (!orders || !orders.length) {
            body.innerHTML = `<tr><td colspan="7">
              <div class="empty-state">
                <strong>No orders</strong>
                <span style="font-size:0.85rem;">Adjust filters or refresh.</span>
              </div>
            </td></tr>`;
            lucide.createIcons();
            return;
          }

          let html = '';
          for (const o of orders) {
            const customer = o.customer_name || o.telegram_username || o.telegram_first_name || 'Anonymous';
            const phone = o.phone ? ' · ' + o.phone : '';
            const amount = o.currency === 'KHR' ? o.subtotal_khr : o.subtotal_usd;
            const amountStr = formatCurrency(amount, o.currency || 'USD');
            const khrStr = o.currency === 'USD' && o.subtotal_khr
              ? new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(o.subtotal_khr) + ' KHR'
              : null;

            const itemsDisplay = o.items && o.items.length
              ? o.items.map(function(it) { return '<b style="color:var(--brand)">' + (it.quantity || 0) + '</b>x ' + (it.name || '—'); }).join('<br>')
              : '—';

            const actionBtns = ''
              + (o.status === 'new'
                ? `<button type="button" class="complete-btn" data-order-id="${o.client_order_id || ''}">Complete</button>`
                : '')
              + `<button type="button" class="delete-btn" data-order-id="${o.client_order_id || ''}">Delete</button>`;

            html += `<tr>
              <td><span class="order-id">${o.client_order_id || '—'}</span></td>
              <td>
                <div class="order-customer">
                  ${truncate(customer, 20)}
                  <span class="sub">${o.fulfillment_method || '—'}${phone}</span>
                </div>
              </td>
              <td>${statusBadge(o.status)}</td>
              <td>
                <div class="order-amount">
                  ${amountStr}
                  ${khrStr ? '<span class="khr">' + khrStr + '</span>' : ''}
                </div>
              </td>
              <td class="order-items">${itemsDisplay}</td>
              <td class="order-time">${formatDate(o.created_at)}</td>
              <td><span class="action-cell">${actionBtns}</span></td>
            </tr>`;
          }
          body.innerHTML = html;

          body.querySelectorAll('.complete-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              completeOrder(btn.dataset.orderId);
            });
          });

          body.querySelectorAll('.delete-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              deleteOrder(btn.dataset.orderId);
            });
          });

          lucide.createIcons();
        }

        function updateStats(orders) {
          let sumUsd = 0, sumKhr = 0, pending = 0;
          for (const o of orders) {
            sumUsd += Number(o.subtotal_usd) || 0;
            sumKhr += Number(o.subtotal_khr) || 0;
            if (['new', 'accepted', 'preparing', 'ready'].includes(o.status)) pending++;
          }
          statTotal.textContent = orders.length;
          statUsd.textContent = formatCurrency(sumUsd, 'USD');
          statKhr.textContent = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(sumKhr) + ' KHR';
          statPending.textContent = pending;
          orderCount.textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '');
        }

        function applyFilters() {
          const status = statusFilter.value;
          const search = searchFilter.value.trim().toLowerCase();
          const dateTerm = dateFilter.value.trim();

          var dateMatch = null;
          if (dateTerm) {
            var parts = dateTerm.split('/');
            if (parts.length === 2) {
              dateMatch = { month: parseInt(parts[0], 10), day: parseInt(parts[1], 10) };
            }
          }

          const filtered = allOrders.filter(function(o) {
            if (status && o.status !== status) return false;
            if (search) {
              var id = (o.client_order_id || '').toLowerCase();
              var name = (o.customer_name || o.telegram_username || o.telegram_first_name || '').toLowerCase();
              if (id.indexOf(search) === -1 && name.indexOf(search) === -1) return false;
            }
            if (dateMatch) {
              var d = new Date(o.created_at);
              if (d.getMonth() + 1 !== dateMatch.month || d.getDate() !== dateMatch.day) return false;
            }
            return true;
          });

          filterResult.textContent = filtered.length + ' of ' + allOrders.length;
          renderOrders(filtered);
          updateStats(filtered);
        }

        function groupOrderItems(rows) {
          if (!rows || !rows.length) return [];
          var map = {};
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var key = r.client_order_id;
            if (!map[key]) {
              map[key] = {
                client_order_id: r.client_order_id,
                created_at: r.created_at,
                status: r.status,
                customer_name: r.customer_name,
                telegram_user_id: r.telegram_user_id,
                telegram_username: r.telegram_username,
                telegram_first_name: r.telegram_first_name,
                phone: r.phone,
                fulfillment_method: r.fulfillment_method,
                currency: r.currency,
                subtotal_usd: Number(r.subtotal_usd) || 0,
                subtotal_khr: Number(r.subtotal_khr) || 0,
                item_count: 0,
                items: []
              };
            }
            map[key].item_count += Number(r.quantity) || 0;
            map[key].items.push({ name: r.name, quantity: r.quantity });
          }
          return Object.values(map);
        }

        async function fetchOrders() {
          if (!supabase) {
            body.innerHTML = `<tr><td colspan="7">
              <div class="empty-state">
                <strong>Supabase not configured</strong>
                <span style="font-size:0.85rem;">Check config.js</span>
              </div>
            </td></tr>`;
            return;
          }

          try {
            var _a = await supabase.from('order_items').select('*').order('created_at', { ascending: false });
            var data = _a.data, error = _a.error;

            if (error) throw error;

            allOrders = groupOrderItems(data || []);
            applyFilters();
          } catch (err) {
            console.error(err);
            body.innerHTML = `<tr><td colspan="7">
              <div class="empty-state">
                <strong>Failed to load</strong>
                <span style="font-size:0.85rem;">${err.message || err.code || 'Unknown error'}</span>
              </div>
            </td></tr>`;
            statTotal.textContent = '—';
            statUsd.textContent = '—';
            statKhr.textContent = '—';
            statPending.textContent = '—';
            orderCount.textContent = '0 orders';
            filterResult.textContent = '0 of 0';
            allOrders = [];
          }
        }

        async function completeOrder(orderId) {
          if (!supabase || !orderId) return;

          var btn = document.querySelector('.complete-btn[data-order-id="' + orderId + '"]');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Completing...';
          }

          try {
            var _a = await supabase.from('order_items').update({ status: 'completed' }).eq('client_order_id', orderId);
            if (_a.error) throw _a.error;
            var _b = await supabase.from('orders').update({ status: 'completed' }).eq('client_order_id', orderId);
            if (_b.error) throw _b.error;
            fetchOrders();
          } catch (e) {
            console.error(e);
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Complete';
            }
            var detail = JSON.stringify({ code: e.code, message: e.message, details: e.details, hint: e.hint }, null, 2);
            alert('Update failed:\n' + detail);
          }
        }

        async function deleteOrder(orderId) {
          if (!supabase || !orderId) return;

          if (!confirm('Delete order ' + orderId + ' and all its items?')) return;

          var btn = document.querySelector('.delete-btn[data-order-id="' + orderId + '"]');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Deleting...';
          }

          try {
            var _a = await supabase.from('order_items').delete().eq('client_order_id', orderId);
            if (_a.error) throw _a.error;
            var _b = await supabase.from('orders').delete().eq('client_order_id', orderId);
            if (_b.error) throw _b.error;
            fetchOrders();
          } catch (e) {
            console.error(e);
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Delete';
            }
            var detail = JSON.stringify({ code: e.code, message: e.message, details: e.details, hint: e.hint }, null, 2);
            alert('Delete failed:\n' + detail);
          }
        }

        function initSupabase() {
          var url = CFG.supabaseUrl || '';
          var key = CFG.supabaseAnonKey || '';

          if (!url || !key || !window.supabase) return false;

          try {
            supabase = window.supabase.createClient(url, key);
            return true;
          } catch (e) {
            console.error(e);
            return false;
          }
        }

        statusFilter.addEventListener('change', applyFilters);
        searchFilter.addEventListener('input', applyFilters);
        dateFilter.addEventListener('input', applyFilters);
        clearFiltersBtn.addEventListener('click', function() {
          statusFilter.value = '';
          searchFilter.value = '';
          dateFilter.value = '';
          applyFilters();
        });
        refreshBtn.addEventListener('click', fetchOrders);

        if (initSupabase()) {
          fetchOrders();
        }

        setInterval(function() {
          if (!document.hidden) fetchOrders();
        }, 60000);
      })();
    </script>
  </body>
</html>
